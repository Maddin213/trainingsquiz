{wb:"1.03",frage:"Bei einer Betriebsbesichtigung stellt die staatliche Arbeitsschutzbehörde erhebliche Verstöße gegen Arbeitsschutzvorschriften fest. Welche Befugnisse beschreibt der Wissensbaustein?",antworten:["Die Behörde darf ausschließlich unverbindliche Hinweise geben und muss für weitere Maßnahmen den Unfallversicherungsträger beauftragen","Die Behörde kann unter anderem Anordnungen erlassen und bei festgestellten Verstößen Bußgelder verhängen","Die Behörde darf nur die Konformität neu hergestellter Produkte prüfen, nicht aber betriebliche Arbeitsbedingungen"],richtig:1,erklaerung:"Die staatlichen Arbeitsschutzbehörden der Länder überwachen die Umsetzung des staatlichen Arbeitsschutzrechts in Betrieben. Ihre Befugnisse reichen von unangemeldeten Betriebsbesichtigungen bis zu Anordnungen und Bußgeldern bei Verstößen. (S. 15)"},

{wb:"1.03",frage:"Ein Betrieb möchte eine betriebliche Regelung zur Vereinbarkeit von Beruf und Familie vereinbaren. Welche rechtliche Gestaltungsmöglichkeit beschreibt der Wissensbaustein?",antworten:["Solche Regelungen dürfen ausschließlich durch unmittelbar geltende EU-Verordnungen getroffen werden","Die gesetzlichen Unfallversicherungsträger müssen jede entsprechende Vereinbarung als Unfallverhütungsvorschrift erlassen","Arbeitgeber und Beschäftigtenvertretungen können im Rahmen der betrieblichen Mitbestimmung entsprechende Regelungen in Betriebsvereinbarungen treffen"],richtig:2,erklaerung:"Neben staatlichem Recht und dem autonomen Recht der Unfallversicherungsträger können auch Sozialpartner Arbeitsschutzaspekte regeln. Tarifverträge und Betriebsvereinbarungen können unter anderem Arbeitszeit, betriebliches Eingliederungsmanagement und die Vereinbarkeit von Beruf und Familie betreffen. (S. 15)"},

{wb:"1.03",frage:"Ein 17-jähriger Auszubildender soll eine Tätigkeit übernehmen, die seine Leistungsfähigkeit übersteigt und mit besonderen Unfallgefahren verbunden ist. Welches Gesetz ist für die besondere Schutzbedürftigkeit maßgeblich?",antworten:["Das Jugendarbeitsschutzgesetz (JArbSchG)","Das Arbeitnehmerüberlassungsgesetz (AÜG)","Das Gesetz über überwachungsbedürftige Anlagen (ÜAnlG)"],richtig:0,erklaerung:"Das JArbSchG schützt Jugendliche unter 18 Jahren besonders. Nach der Darstellung im Wissensbaustein dürfen Jugendliche keine Arbeiten ausführen, die ihre Leistungsfähigkeit übersteigen oder mit besonderen Unfallgefahren verbunden sind. Das Gesetz setzt die europäische Jugendarbeitsschutzrichtlinie um. (S. 22)"},

{wb:"1.03",frage:"Eine Fachkraft für Arbeitssicherheit prüft die rechtliche Einordnung einer Aufzugsanlage, von der beim Betrieb erhebliche Risiken ausgehen können. Welches Gesetz regelt ergänzend Betreiberpflichten sowie Aufgaben und Zulassung zugelassener Überwachungsstellen?",antworten:["Das Arbeitnehmerüberlassungsgesetz (AÜG)","Das Gesetz über überwachungsbedürftige Anlagen (ÜAnlG)","Das Mutterschutzgesetz (MuSchG)"],richtig:1,erklaerung:"Das ÜAnlG ergänzt die Vorschriften zur Produktsicherheit und Betriebssicherheit. Es regelt insbesondere Pflichten von Betreibern überwachungsbedürftiger Anlagen, Aufgaben und Zulassung zugelassener Überwachungsstellen sowie Befugnisse der Landesaufsichtsbehörden. Aufzugsanlagen werden ausdrücklich als Beispiel genannt. (S. 21)"},

{wb:"1.03",frage:"Ein Unfallversicherungsträger möchte eine verbindliche Vorschrift für eine eng begrenzte branchenspezifische Gefährdung erlassen, deren Regelung im staatlichen Vorschriftenwerk zu speziell wäre. Wie ist dies nach dem Wissensbaustein einzuordnen?",antworten:["Eine solche Vorschrift ist grundsätzlich ausgeschlossen, sobald es allgemeines staatliches Arbeitsschutzrecht gibt","Eine solche Vorschrift darf ohne festgelegtes Verfahren unmittelbar durch einen einzelnen Aufsichtsdienst in Kraft gesetzt werden","Eine solche Gefährdungslage gehört zu den genannten möglichen Anlässen für Unfallverhütungsvorschriften; deren Erlass unterliegt einem festgelegten Beschluss- und Genehmigungsverfahren"],richtig:2,erklaerung:"Der Wissensbaustein nennt eng begrenzte branchenspezifische Gefährdungslagen ausdrücklich als möglichen Anlass für Unfallverhütungsvorschriften. Diese werden in einem festgelegten Verfahren erarbeitet, von der Vertretersammlung beschlossen und durch das BMAS im Benehmen mit den zuständigen Landesbehörden genehmigt. (S. 25)"},

{wb:"1.03",frage:"Ein Betrieb möchte wissen, welche Unterlagen der DGUV unmittelbar verbindliche Pflichten begründen und welche lediglich Hilfestellungen zur Umsetzung enthalten. Welche Einordnung ist richtig?",antworten:["DGUV Vorschriften können verbindliche Pflichten begründen; DGUV Regeln und Informationen dienen insbesondere der Konkretisierung beziehungsweise praktischen Orientierung","DGUV Informationen sind die oberste verbindliche Rechtsquelle; DGUV Vorschriften enthalten lediglich unverbindliche Beispiele","DGUV Grundsätze ersetzen sämtliche staatlichen Gesetze und Rechtsverordnungen, sobald sie ein Prüfverfahren beschreiben"],richtig:0,erklaerung:"DGUV Vorschriften sind verbindliche Unfallverhütungsvorschriften für die jeweiligen Mitgliedsbetriebe. DGUV Regeln konkretisieren Anforderungen und haben empfehlenden Charakter. DGUV Informationen geben Hinweise für Branchen, Tätigkeiten, Arbeitsmittel oder Zielgruppen, während DGUV Grundsätze insbesondere Maßstäbe für Verfahrensfragen enthalten. (S. 24–25)"},

{wb:"1.03",frage:"Ein Betrieb erhält Besuch vom Aufsichtsdienst seines Unfallversicherungsträgers. Dieser möchte Arbeitsstoffe beproben und die Ursachen eines Arbeitsunfalls untersuchen. Welche Aussage entspricht dem Wissensbaustein?",antworten:["Diese Maßnahmen sind ausschließlich den staatlichen Marktüberwachungsbehörden vorbehalten","Die Aufsichtsdienste der Unfallversicherungsträger verfügen über entsprechende Befugnisse zur Überwachung des Arbeitsschutzes und zur Durchsetzung erforderlicher Maßnahmen","Die Aufsichtsdienste dürfen nur schriftliche Auskünfte verlangen, jedoch weder Betriebsbesichtigungen durchführen noch Unfälle untersuchen"],richtig:1,erklaerung:"Die Aufsichtsdienste der Unfallversicherungsträger überwachen den Arbeitsschutz und die Umsetzung ihres Vorschriften- und Regelwerks. Sie dürfen unter anderem Betriebsbesichtigungen durchführen, Auskünfte verlangen, Proben von Arbeitsstoffen entnehmen, Unfälle untersuchen und Anordnungen erlassen. (S. 25)"},

{wb:"1.03",frage:"Ein Unternehmen möchte für seine Beschäftigten eine besonders günstige Arbeitszeitregelung vereinbaren. Die Geschäftsleitung argumentiert, europäische Mindestanforderungen dürften national keinesfalls überschritten werden. Wie ist dies zu beurteilen?",antworten:["Die Aussage ist zutreffend, weil für Arbeitszeitregelungen dieselbe vollständige Harmonisierung wie für Produktvorschriften gilt","Eine günstigere Regelung ist nur möglich, wenn die EU-Arbeitszeitrichtlinie zuvor aufgehoben wird","Die Aussage ist unzutreffend, weil europäische Betriebsvorschriften Mindeststandards enthalten und nationale beziehungsweise betriebliche Regelungen ein höheres Schutzniveau vorsehen können"],richtig:2,erklaerung:"Die europäischen Betriebsvorschriften, zu denen auch Mindestanforderungen des sozialen Arbeitsschutzes gehören, legen ein Mindestschutzniveau fest. Weitergehende Schutzstandards sind möglich. Der Wissensbaustein beschreibt außerdem Tarifverträge und Betriebsvereinbarungen als Möglichkeiten zur Regelung von Arbeitszeitfragen. (S. 6, 10, 15)"},

{wb:"1.05",frage:"Welche beiden Säulen bilden das duale Arbeitsschutzsystem in Deutschland?",antworten:["Bundesministerien und kommunale Gewerbeämter","Staatlicher Arbeitsschutz und selbstverwaltete Unfallversicherungsträger","Arbeitgeberverbände und gesetzliche Krankenversicherung"],richtig:1,erklaerung:"Das duale Arbeitsschutzsystem besteht aus dem staatlichen Arbeitsschutz und den selbstverwalteten Unfallversicherungsträgern. Beide haben eigene und gemeinsame Aufgaben: Sie erlassen Vorschriften, beraten Betriebe und überwachen deren Einhaltung. Die Abbildung verdeutlicht die parallelen Aufgaben und die Zusammenarbeit im Rahmen der GDA. (S. 3)"},

{wb:"1.05",frage:"Welches Bundesministerium ist fachlich für Sicherheit und Gesundheit bei der Arbeit zuständig?",antworten:["Das Bundesministerium für Arbeit und Soziales (BMAS)","Das Bundesministerium für Gesundheit (BMG)","Das Bundesministerium für Wirtschaft und Klimaschutz (BMWK)"],richtig:0,erklaerung:"Die fachliche Zuständigkeit für den Arbeitsschutz liegt auf Bundesebene beim BMAS. Es ist insbesondere für die Erarbeitung von Gesetzen und Verordnungen im Arbeitsschutz zuständig. Die Bundesländer wirken über den Bundesrat an der Rechtsetzung mit. (S. 4, 6)"},

{wb:"1.05",frage:"Welche Institution unterstützt das BMAS durch Forschung, Politikberatung, Wissenstransfer und die Geschäftsführung von Arbeitsschutzausschüssen?",antworten:["Die Deutsche Gesetzliche Unfallversicherung (DGUV)","Der Länderausschuss für Arbeitsschutz und Sicherheitstechnik (LASI)","Die Bundesanstalt für Arbeitsschutz und Arbeitsmedizin (BAuA)"],richtig:2,erklaerung:"Die BAuA ist dem BMAS zugeordnet. Zu ihren Aufgaben gehören Politikberatung, Forschung zu Sicherheit und Gesundheit bei der Arbeit, Wissenstransfer, Unterstützung der Marktüberwachung, Geschäftsführung von Ausschüssen und die Geschäftsstelle der Nationalen Arbeitsschutzkonferenz. (S. 6)"},

{wb:"1.05",frage:"Welche drei Hauptaufgaben erfüllen die gesetzlichen Unfallversicherungsträger nach dem SGB VII?",antworten:["Rechtsetzung, Marktüberwachung und Gewerbeanmeldung","Prävention, Rehabilitation und Entschädigung","Arbeitsvermittlung, Krankenversicherung und Rentenberatung"],richtig:1,erklaerung:"Die drei Hauptaufgaben der Unfallversicherungsträger sind Prävention, Rehabilitation und Entschädigung. Sie sollen Arbeits- und Wegeunfälle, Berufskrankheiten sowie arbeitsbedingte Gesundheitsgefahren verhüten, die Gesundheit und Leistungsfähigkeit der Versicherten wiederherstellen und finanzielle Entschädigungen leisten. Die Grafik auf Seite 16 stellt diese drei Aufgabenbereiche dar. (S. 15–16)"},

{wb:"1.05",frage:"Welche drei Bereiche bilden die Trägerstruktur der gesetzlichen Unfallversicherung?",antworten:["Gewerbliche Berufsgenossenschaften, Unfallversicherungsträger der öffentlichen Hand und landwirtschaftliche Unfallversicherung","Gesetzliche Krankenkassen, Rentenversicherungsträger und staatliche Gewerbeaufsicht","Bundesanstalt für Arbeitsschutz, Landesministerien und Nationale Arbeitsschutzkonferenz"],richtig:0,erklaerung:"Die gesetzliche Unfallversicherung gliedert sich in gewerbliche Berufsgenossenschaften, Unfallversicherungsträger der öffentlichen Hand und die landwirtschaftliche Unfallversicherung. Die ersten beiden Bereiche gehören dem Spitzenverband DGUV an. Die landwirtschaftliche Unfallversicherung ist Teil der SVLFG. (S. 12)"},

{wb:"1.05",frage:"Welche Organe bilden die ehrenamtliche Selbstverwaltung eines Unfallversicherungsträgers?",antworten:["Bundesrat und Nationale Arbeitsschutzkonferenz","Geschäftsstelle und staatliche Gewerbeaufsicht","Vertreterversammlung und Vorstand"],richtig:2,erklaerung:"Die Selbstverwaltungsorgane der Unfallversicherungsträger sind Vertreterversammlung und Vorstand. Beide sind paritätisch mit Vertretungen der Beschäftigten und Arbeitgeber besetzt. Die Vertreterversammlung beschließt unter anderem die Satzung und wählt den Vorstand. Dieser leitet die Verwaltung und vertritt den Unfallversicherungsträger nach außen. (S. 14)"},

{wb:"1.05",frage:"Welche Institution ist das zentrale Entscheidungsgremium der Gemeinsamen Deutschen Arbeitsschutzstrategie?",antworten:["Der Länderausschuss für Arbeitsschutz und Sicherheitstechnik","Die Nationale Arbeitsschutzkonferenz (NAK)","Das jährlich stattfindende Arbeitsschutzforum"],richtig:1,erklaerung:"Die Nationale Arbeitsschutzkonferenz ist das zentrale Entscheidungsgremium der GDA. Ihr gehören jeweils drei stimmberechtigte Mitglieder des Bundes, der Arbeitsschutzbehörden der Länder und der Unfallversicherung an. Arbeitgeberverbände und Gewerkschaften wirken beratend mit. (S. 22)"},

{wb:"1.05",frage:"Welche vier Kernelemente umfasst die Gemeinsame Deutsche Arbeitsschutzstrategie?",antworten:["Gemeinsame Arbeitsschutzziele und Arbeitsprogramme, abgestimmte Beratung und Überwachung, klares Vorschriften- und Regelwerk sowie Evaluierung","Gesetzliche Krankenversicherung, Rentenversicherung, Unfallversicherung und Pflegeversicherung","Betriebsbesichtigungen, Unfallanzeigen, Beitragsberechnung und Rentenfestsetzung"],richtig:0,erklaerung:"Die GDA umfasst vier Kernelemente: gemeinsame Arbeitsschutzziele und Arbeitsprogramme, ein abgestimmtes Vorgehen bei Beratung und Überwachung, ein klares und anwenderfreundliches Vorschriften- und Regelwerk sowie die Evaluierung der Ziele und Programme. Diese Elemente bilden zusammen eine umfassende Strategie zur Verbesserung des Arbeitsschutzes. (S. 23–25)"},

{wb:"1.05",frage:"Warum besitzen sowohl staatliche Arbeitsschutzbehörden als auch Unfallversicherungsträger Befugnisse zur Beratung und Überwachung von Betrieben?",antworten:["Weil die Unfallversicherungsträger ausschließlich im Auftrag der Landesbehörden tätig werden","Weil die staatlichen Behörden nur Produkte kontrollieren und sämtliche betrieblichen Kontrollen den Unfallversicherungsträgern übertragen wurden","Weil das historisch gewachsene duale System beiden Seiten eigene und gemeinsame Aufgaben im überbetrieblichen Arbeitsschutz zuweist"],richtig:2,erklaerung:"Im dualen Arbeitsschutzsystem verfügen Staat und Unfallversicherungsträger über eigene Aufgaben und Zuständigkeiten. Beide beraten Betriebe präventiv und überwachen die Umsetzung einschlägiger Vorschriften. Die GDA soll ihre Aktivitäten aufeinander abstimmen und Doppelarbeit reduzieren. (S. 3–4, 20)"},

{wb:"1.05",frage:"Weshalb dürfen Unfallversicherungsträger nicht beliebig zusätzliche Unfallverhütungsvorschriften erlassen?",antworten:["Weil sämtliche Unfallverhütungsvorschriften ausschließlich durch den Bundestag beschlossen werden müssen","Weil ihre autonome Rechtsetzung staatliche Vorschriften ergänzen soll und eine Bedarfsprüfung sowie die Genehmigung durch das BMAS im Benehmen mit den Ländern erforderlich sind","Weil Unfallverhütungsvorschriften grundsätzlich nur unverbindliche Empfehlungen darstellen"],richtig:1,erklaerung:"Die autonome Rechtsetzung der Unfallversicherungsträger beruht auf dem SGB VII und folgt dem Subsidiaritätsprinzip. Unfallverhütungsvorschriften sollen staatliche Regelungen ergänzen, wenn ein entsprechender Regelungsbedarf besteht. Ihre Genehmigung erfolgt nach einer Bedarfsprüfung durch das BMAS im Benehmen mit den Ländern. (S. 4, 16)"},

{wb:"1.05",frage:"Warum ist die BAuA nicht mit einer staatlichen Gewerbeaufsichtsbehörde gleichzusetzen?",antworten:["Weil die BAuA vor allem wissenschaftliche, beratende und unterstützende Aufgaben auf Bundesebene übernimmt, während Landesbehörden den betrieblichen Arbeitsschutz vor Ort überwachen","Weil die BAuA ausschließlich Beiträge zur gesetzlichen Unfallversicherung erhebt, während die Gewerbeaufsicht wissenschaftliche Forschung betreibt","Weil die BAuA nur für kommunale Betriebe zuständig ist, während die Gewerbeaufsicht ausschließlich Bundesbehörden kontrolliert"],richtig:0,erklaerung:"Die BAuA unterstützt das BMAS insbesondere durch Forschung, Politikberatung und Wissenstransfer. Die Landesbehörden für Arbeitsschutz erfüllen dagegen die unmittelbaren staatlichen Beratungs- und Überwachungsaufgaben in den Betrieben. Ihre Aufgaben unterscheiden sich somit hinsichtlich Funktion und organisatorischer Ebene. (S. 6–7)"},

{wb:"1.05",frage:"Welche Bedeutung hat der Länderausschuss für Arbeitsschutz und Sicherheitstechnik (LASI) für den staatlichen Arbeitsschutz?",antworten:["Er übernimmt die Selbstverwaltung der Berufsgenossenschaften und beschließt deren Unfallverhütungsvorschriften","Er ersetzt die Landesbehörden bei sämtlichen Betriebsbesichtigungen und verhängt bundesweit einheitliche Bußgelder","Er koordiniert die Aktivitäten der Länder und fördert eine einheitliche Anwendung der Arbeitsschutzvorschriften"],richtig:2,erklaerung:"Der LASI koordiniert die Aktivitäten der Länder im Arbeitsschutz. Seine Arbeitsgruppen bearbeiten fachliche und rechtliche Detailfragen mit dem Ziel einer einheitlichen Rechtsanwendung. LASI-Veröffentlichungen richten sich an Landesbehörden und können auch Betrieben Orientierung bei der Auslegung von Vorschriften geben. (S. 9)"},

{wb:"1.05",frage:"Worin unterscheiden sich die Aufgaben der Landesbehörden im betrieblichen Arbeitsschutz und in der Marktüberwachung?",antworten:["Der betriebliche Arbeitsschutz betrifft ausschließlich Beschäftigte öffentlicher Einrichtungen, die Marktüberwachung ausschließlich gewerbliche Unternehmen","Im betrieblichen Arbeitsschutz werden Arbeitsbedingungen und die Umsetzung staatlicher Vorschriften überwacht; die Marktüberwachung kontrolliert die Rechtskonformität und Sicherheit bereitgestellter Produkte","Im betrieblichen Arbeitsschutz werden nur Unfälle untersucht, während die Marktüberwachung sämtliche sozialen Schutzvorschriften kontrolliert"],richtig:1,erklaerung:"Im betrieblichen Arbeitsschutz beraten die Landesbehörden Unternehmen und überwachen die Umsetzung staatlicher Arbeitsschutzvorschriften. Die Marktüberwachung richtet sich dagegen auf Produkte, die auf dem Markt bereitgestellt werden. Dabei wird geprüft, ob diese den rechtlichen Anforderungen entsprechen und kein ernstes Risiko darstellen. (S. 7–8)"},

{wb:"1.05",frage:"Warum steht bei staatlichen Betriebsbesichtigungen die Beratung grundsätzlich vor Zwangsmaßnahmen?",antworten:["Weil die Behörden zunächst durch Erläuterung von Vorschriften und fachliche Unterstützung auf eine wirksame Umsetzung des Arbeitsschutzes hinwirken sollen","Weil staatliche Behörden keine verbindlichen Anordnungen erlassen dürfen, solange ein Unfallversicherungsträger zuständig ist","Weil Zwangsmaßnahmen ausschließlich nach einem bereits eingetretenen Arbeitsunfall rechtlich möglich sind"],richtig:0,erklaerung:"Die staatlichen Arbeitsschutzbehörden nutzen Besichtigungen und Revisionen vorrangig zur Beratung. Sie erläutern Vorschriften und den Stand der Technik und unterstützen die Weiterentwicklung des betrieblichen Arbeitsschutzsystems. Bei festgestellten Defiziten können sie jedoch Anordnungen und erforderlichenfalls Zwangsmaßnahmen einleiten. (S. 9–10)"},

{wb:"1.05",frage:"Welche Bedeutung hat die Pflichtmitgliedschaft der Unternehmen in der gesetzlichen Unfallversicherung für deren Finanzierung?",antworten:["Beschäftigte und Arbeitgeber finanzieren die gesetzliche Unfallversicherung grundsätzlich zu gleichen Teilen","Die Unfallversicherungsträger erhalten ihre Beiträge ausschließlich aus allgemeinen Steuermitteln","Die Beiträge werden grundsätzlich von den Arbeitgebern getragen; die landwirtschaftliche Unfallversicherung erhält zusätzlich staatliche Zuschüsse"],richtig:2,erklaerung:"Nach dem Wissensbaustein ist jedes Unternehmen Pflichtmitglied bei einem Unfallversicherungsträger. Anders als bei den übrigen Sozialversicherungszweigen werden die Beiträge zur gesetzlichen Unfallversicherung grundsätzlich allein von den Arbeitgebern finanziert. Die landwirtschaftliche Unfallversicherung wird zusätzlich staatlich subventioniert. (S. 12)"},

{wb:"1.05",frage:"Warum gehören gewerbliche Berufsgenossenschaften und Unfallversicherungsträger der öffentlichen Hand zum gemeinsamen Spitzenverband DGUV?",antworten:["Weil die DGUV sämtliche Mitgliedsbetriebe unmittelbar beaufsichtigt und die einzelnen Unfallversicherungsträger vollständig ersetzt","Weil die DGUV gemeinsame Präventionsmaßnahmen, Forschung, Ausbildung und Muster-Unfallverhütungsvorschriften koordiniert und dabei die Selbstständigkeit ihrer Mitglieder grundsätzlich wahrt","Weil die DGUV als Bundesministerium alle staatlichen Arbeitsschutzgesetze erlässt"],richtig:1,erklaerung:"Die DGUV ist als rechtsfähiger Verein organisiert und bildet den gemeinsamen Spitzenverband der gewerblichen Berufsgenossenschaften und Unfallversicherungsträger der öffentlichen Hand. Sie koordiniert gemeinsame Maßnahmen, fördert Forschung, unterstützt die Ausbildung und wirkt auf einheitliche Unfallverhütungsvorschriften hin. Die Selbstständigkeit der Mitglieder bleibt grundsätzlich erhalten. (S. 13–14)"},

{wb:"1.05",frage:"Warum werden die Unfallversicherungsträger als Körperschaften des öffentlichen Rechts bezeichnet?",antworten:["Weil sie ausschließlich privatwirtschaftliche Versicherungsverträge mit Unternehmen abschließen","Weil sie ihre Aufgaben unabhängig von gesetzlichen Vorgaben und staatlicher Aufsicht selbst bestimmen können","Weil ihnen durch öffentliches Recht, insbesondere das SGB VII, hoheitliche Aufgaben und Befugnisse übertragen werden"],richtig:2,erklaerung:"Die Unfallversicherungsträger erhalten ihre Befugnisse durch öffentliches Recht, insbesondere das SGB VII. Sie erfüllen vom Staat übertragene öffentliche Aufgaben und sind deshalb Körperschaften des öffentlichen Rechts. Ihre Selbstverwaltung bedeutet nicht, dass sie außerhalb gesetzlicher Vorgaben handeln dürfen. (S. 14)"},

{wb:"1.05",frage:"Wie unterscheiden sich die Aufgaben von Vertreterversammlung, Vorstand und Hauptgeschäftsführung eines Unfallversicherungsträgers?",antworten:["Die Vertreterversammlung beschließt autonomes Recht und wählt den Vorstand; der Vorstand leitet die Verwaltung; die Hauptgeschäftsführung führt die laufenden Verwaltungsgeschäfte","Die Hauptgeschäftsführung erlässt Unfallverhütungsvorschriften; der Vorstand genehmigt Bundesgesetze; die Vertreterversammlung überwacht ausschließlich Betriebsunfälle","Die Vertreterversammlung führt die täglichen Verwaltungsgeschäfte; der Vorstand übernimmt ausschließlich die Ausbildung der Aufsichtspersonen; die Hauptgeschäftsführung vertritt nur die Beschäftigten"],richtig:0,erklaerung:"Die Vertreterversammlung beschließt die Satzung und sonstiges autonomes Recht, insbesondere Unfallverhütungsvorschriften, und wählt den Vorstand. Der Vorstand leitet die Verwaltung und vertritt den Träger nach außen. Die hauptamtliche Hauptgeschäftsführung erledigt die laufenden Verwaltungsgeschäfte und übernimmt die gerichtliche und außergerichtliche Vertretung. (S. 14)"},

{wb:"1.05",frage:"Welche Aussage beschreibt das Umlageverfahren der gesetzlichen Unfallversicherung zutreffend?",antworten:["Die Beiträge werden unabhängig von den tatsächlichen Aufwendungen ausschließlich nach der Beschäftigtenzahl festgelegt","Die Aufwendungen werden erfasst und nach Abzug der Einnahmen auf die Mitgliedsunternehmen umgelegt; die individuelle Beitragshöhe richtet sich nach Gefahrtarif und Arbeitsentgelten","Die Beiträge dienen vor allem der Erwirtschaftung von Gewinnen, die anschließend an die Mitgliedsunternehmen ausgeschüttet werden"],richtig:1,erklaerung:"Die Unfallversicherungsträger arbeiten kostendeckend und nicht gewinnorientiert. Im Umlageverfahren werden die Aufwendungen für Prävention, Entschädigung und Verwaltung nach Abzug der Einnahmen auf die Unternehmen verteilt. Für die konkrete Beitragshöhe sind Gefahrtarif und Arbeitsentgelte maßgeblich. (S. 15)"},

{wb:"1.05",frage:"Warum besitzen DGUV Regeln nicht dieselbe Vermutungswirkung wie staatliche Technische Regeln?",antworten:["Weil DGUV Regeln ausschließlich finanzielle Entschädigungsleistungen beschreiben","Weil DGUV Regeln grundsätzlich nicht mit staatlichen Vorschriften abgestimmt werden","Weil sie konkrete Präventionsmaßnahmen erläutern, ihre Anwendung aber keine Vermutung der Erfüllung einschlägiger staatlicher Arbeitsschutzvorschriften auslöst"],richtig:2,erklaerung:"Regeln der Unfallversicherungsträger erläutern konkrete Präventionsmaßnahmen und sind mit dem staatlichen Regelwerk abgestimmt. Anders als staatliche Technische Regeln lösen sie jedoch keine Vermutungswirkung hinsichtlich der Erfüllung der einschlägigen Arbeitsschutzvorschriften aus. (S. 16)"},

{wb:"1.05",frage:"Wie unterscheiden sich medizinische, berufliche und soziale Rehabilitation innerhalb der gesetzlichen Unfallversicherung?",antworten:["Medizinische Rehabilitation dient der Heilbehandlung, berufliche Rehabilitation der Wiedereingliederung in das Arbeitsleben und soziale Rehabilitation umfasst ergänzende Leistungen zur Teilhabe","Medizinische Rehabilitation umfasst ausschließlich Rentenzahlungen, berufliche Rehabilitation die Unfallverhütung und soziale Rehabilitation die Kontrolle von Betrieben","Medizinische Rehabilitation betrifft ausschließlich Berufskrankheiten, berufliche Rehabilitation ausschließlich Wegeunfälle und soziale Rehabilitation ausschließlich Arbeitsunfälle"],richtig:0,erklaerung:"Die Unfallversicherungsträger erbringen Heilbehandlung als medizinische Rehabilitation und Berufshilfe zur beruflichen Wiedereingliederung. Dabei werden Eignung, Neigung und bisherige Tätigkeit berücksichtigt. Hinzu kommen soziale Rehabilitation und ergänzende Leistungen, beispielsweise die Übernahme von Schulungskosten. (S. 17)"},

{wb:"1.05",frage:"Welche Bedeutung hat der im Wissensbaustein beschriebene Haftungsausschluss für Unternehmen?",antworten:["Arbeitgeber sind grundsätzlich von sämtlichen Pflichten zur Unfallverhütung befreit, sobald sie Beiträge zahlen","Wenn die gesetzliche Unfallversicherung für einen Schaden eintritt, sind im Regelfall weitere Ansprüche der Beschäftigten gegenüber dem Arbeitgeber ausgeschlossen","Beschäftigte verlieren durch die gesetzliche Unfallversicherung ihren Anspruch auf Rehabilitation und Entschädigung"],richtig:1,erklaerung:"Der Haftungsausschluss schafft wirtschaftliche und rechtliche Sicherheit für Arbeitgeber. Wenn die gesetzliche Unfallversicherung für einen Schaden eintritt, sind weitere Ansprüche von Beschäftigten gegenüber dem Arbeitgeber im Regelfall ausgeschlossen. Die Arbeitsschutzpflichten des Arbeitgebers bleiben davon unberührt. (S. 18)"},

{wb:"1.05",frage:"Weshalb ist die Gemeinsame Deutsche Arbeitsschutzstrategie mehr als eine unverbindliche Kooperationsvereinbarung?",antworten:["Weil sie sämtliche bestehenden staatlichen Arbeitsschutzgesetze und Unfallverhütungsvorschriften ersetzt","Weil sie ausschließlich auf freiwilligen Absprachen einzelner Betriebe beruht","Weil ArbSchG und SGB VII Bund, Länder und Unfallversicherungsträger zu abgestimmten Aktivitäten verpflichten"],richtig:2,erklaerung:"Die GDA ist ein gesetzlicher Handlungsauftrag. Ihre Grundlagen liegen im Arbeitsschutzgesetz und im SGB VII. Sie verpflichtet Bund, Länder und Unfallversicherungsträger zu abgestimmtem Handeln und soll bundesweit einheitliche und effiziente Beratungs- und Überwachungsaktivitäten ermöglichen. (S. 20)"},

{wb:"1.05",frage:"Warum gehören sowohl zeitlich begrenzte Arbeitsprogramme als auch eine langfristige Strategie zur GDA?",antworten:["Weil konkrete Arbeitsschutzziele in Arbeitsprogrammen umgesetzt werden, während die GDA dauerhaft die Zusammenarbeit und Weiterentwicklung des Arbeitsschutzsystems unterstützt","Weil die GDA nach jeder Arbeitsprogrammperiode vollständig endet und durch eine neue gesetzliche Unfallversicherung ersetzt wird","Weil Arbeitsprogramme ausschließlich die Finanzierung der Unfallversicherung regeln und keinen Bezug zu Präventionszielen haben"],richtig:0,erklaerung:"Die GDA ist als dauerhafte Zusammenarbeit von Bund, Ländern und Unfallversicherungsträgern angelegt. Sie arbeitet zugleich in zeitlich begrenzten Perioden, für die konkrete Arbeitsschutzziele und Arbeitsprogramme festgelegt werden. Dadurch werden langfristige strategische Ziele mit umsetzbaren Maßnahmen verbunden. (S. 21–22)"},

{wb:"1.05",frage:"Worin unterscheiden sich die Evaluierung einzelner GDA-Arbeitsprogramme und die Dachevaluation?",antworten:["Die Programmevaluation untersucht ausschließlich Beitragseinnahmen, während die Dachevaluation einzelne Betriebsunfälle strafrechtlich bewertet","Die Programmevaluation prüft die Wirkung konkreter Maßnahmen und Zielerreichung; die Dachevaluation beurteilt die langfristige Gesamtwirkung der GDA auf das Arbeitsschutzsystem","Die Programmevaluation wird ausschließlich von Unternehmen durchgeführt, während die Dachevaluation ausschließlich Unfallversicherungsvorschriften erlässt"],richtig:1,erklaerung:"Bei der Evaluierung einzelner Arbeitsprogramme wird untersucht, ob die angestrebten Effekte eintreten und Arbeitsschutzziele erreicht werden. Die Dachevaluation bewertet dagegen die langfristige Gesamtwirkung der GDA auf das Arbeitsschutzsystem sowie Sicherheit und Gesundheit bei der Arbeit. Ihre Ergebnisse können zur Anpassung der Strategie dienen. (S. 25)"},

{wb:"1.05",frage:"Ein Unternehmen erhält am selben Tag Besuch einer staatlichen Arbeitsschutzbehörde und einer Aufsichtsperson seines Unfallversicherungsträgers. Die Geschäftsleitung behauptet, nur eine der beiden Stellen dürfe den betrieblichen Arbeitsschutz überwachen. Wie ist dies zu bewerten?",antworten:["Die Aussage ist zutreffend, weil die staatliche Aufsicht mit der Mitgliedschaft in einem Unfallversicherungsträger entfällt","Die Aussage ist zutreffend, weil Unfallversicherungsträger ausschließlich nach einem eingetretenen Unfall tätig werden dürfen","Die Aussage ist unzutreffend, weil im dualen Arbeitsschutzsystem beide Seiten Beratungs- und Überwachungsaufgaben wahrnehmen und ihre Aktivitäten abstimmen sollen"],richtig:2,erklaerung:"Staatliche Arbeitsschutzbehörden und Unfallversicherungsträger besitzen im dualen System jeweils eigene Beratungs- und Überwachungsaufgaben. Die GDA soll ein abgestimmtes, systematisches Vorgehen sicherstellen. Die Zuständigkeit einer Seite schließt die Tätigkeit der anderen daher nicht grundsätzlich aus. (S. 3–4, 20)"},

{wb:"1.05",frage:"Ein neuer Betrieb wird beim Gewerbeamt angemeldet. Der Inhaber geht davon aus, dass die Gewerbeanmeldung bereits eine umfassende Arbeitsschutzprüfung ersetzt. Welche Einordnung ist richtig?",antworten:["Die Gewerbeaufsicht wird über neue Betriebe informiert und kann die Einhaltung einschlägiger Vorschriften überwachen; die Gewerbeanmeldung ersetzt diese Kontrolle nicht","Mit der Gewerbeanmeldung gelten sämtliche Arbeitsschutzvorschriften automatisch als überprüft und erfüllt","Das Gewerbeamt übernimmt nach der Anmeldung dauerhaft sämtliche Aufgaben der staatlichen Arbeitsschutzaufsicht"],richtig:0,erklaerung:"Der Wissensbaustein unterscheidet ausdrücklich zwischen Gewerbeamt und Gewerbeaufsicht. Im Rahmen der Gewerbeanmeldung wird die Gewerbeaufsicht über den neuen Betrieb informiert. Insbesondere erlaubnis- und genehmigungspflichtige Gewerbe werden regelmäßig auf die Einhaltung von Vorschriften überprüft. (S. 7)"},

{wb:"1.05",frage:"Ein Betrieb verursacht erhebliche Lärmbelästigungen in seiner Nachbarschaft. Gleichzeitig bestehen Mängel beim Schutz der Beschäftigten vor Lärm. Welche Zuständigkeit der Landesbehörden ist hier besonders relevant?",antworten:["Ausschließlich die Marktüberwachung, weil Lärm grundsätzlich als Produkteigenschaft behandelt wird","Betrieblicher Arbeitsschutz und Immissionsschutz, weil sowohl die Beschäftigten als auch das betriebliche Umfeld betroffen sind","Ausschließlich die gesetzliche Rentenversicherung, weil Lärm langfristige Gesundheitsschäden verursachen kann"],richtig:1,erklaerung:"Die Landesbehörden sind sowohl für den betrieblichen Arbeitsschutz als auch für den Immissionsschutz zuständig. Sie schützen Beschäftigte vor Gesundheitsgefahren und das betriebliche Umfeld vor schädlichen Umwelteinflüssen. Beschwerden über Lärmbelästigungen durch Gewerbebetriebe gehören ausdrücklich zu ihren Aufgaben. (S. 7–8)"},

{wb:"1.05",frage:"Bei einer unangemeldeten staatlichen Betriebsbesichtigung verweigert ein Arbeitgeber die Einsicht in erforderliche Unterlagen mit dem Hinweis auf Betriebsgeheimnisse. Welche Aussage entspricht den beschriebenen Befugnissen und Pflichten?",antworten:["Die Behörde muss die Kontrolle sofort beenden, sobald der Arbeitgeber Betriebsgeheimnisse geltend macht","Der Arbeitgeber darf sämtliche Unterlagen zurückhalten, wenn die Fachkraft für Arbeitssicherheit deren Inhalt kennt","Die Behörde darf erforderliche Unterlagen einsehen; der Arbeitgeber muss mitwirken und die Behörde ist zur vertraulichen Behandlung betrieblicher Interna verpflichtet"],richtig:2,erklaerung:"Staatliche Arbeitsschutzbehörden dürfen Betriebsbesichtigungen durchführen und erforderliche Auskünfte sowie Unterlagen verlangen. Sie können auch Akten und Urkunden einsehen und Gegenstände zur Beweissicherung beschlagnahmen. Gleichzeitig sind sie verpflichtet, betriebsinterne Angelegenheiten vertraulich zu behandeln. (S. 9)"},

{wb:"1.05",frage:"Nach einer staatlichen Revision erhält ein Betrieb ein Schreiben mit festgestellten Arbeitsschutzmängeln und einer Frist zur Beseitigung. Welches Verfahren beschreibt dieser Vorgang?",antworten:["Ein Revisionsschreiben mit Befunden und geforderten Arbeitsschutzmaßnahmen","Ein abgeschlossenes Strafverfahren mit unmittelbar festgesetzter Freiheitsstrafe","Ein Verfahren zur Festsetzung der Beiträge zur gesetzlichen Unfallversicherung"],richtig:0,erklaerung:"Nach einer Revision können die Behörden ein Revisionsschreiben erstellen, das die festgestellten Mängel und erforderlichen Maßnahmen enthält. Dem Arbeitgeber wird eine Frist zur Umsetzung gesetzt. Davon zu unterscheiden sind förmliche Anordnungen, Zwangsmaßnahmen und Bußgeldverfahren. (S. 10)"},

{wb:"1.05",frage:"Ein Arbeitgeber ignoriert wiederholt eine behördliche Anordnung zur Beseitigung erheblicher Sicherheitsmängel. Welche Reaktion ist nach dem Wissensbaustein möglich?",antworten:["Die Behörde darf ausschließlich eine weitere unverbindliche Beratung anbieten","Die Behörde kann je nach Landesrecht Zwangsmaßnahmen wie Zwangsgeld oder Ersatzvornahme einleiten und gegebenenfalls Bußgeldverfahren oder Strafanzeigen veranlassen","Die Behörde muss ihre Zuständigkeit vollständig an die Berufsgenossenschaft abgeben"],richtig:1,erklaerung:"Wenn Arbeitgeber behördlichen Anordnungen nicht nachkommen, können die Landesbehörden Zwangsmaßnahmen treffen. Der Wissensbaustein nennt Zwangsgeld, kostenpflichtige Ersatzvornahme und unmittelbaren Zwang. Bei beharrlicher Missachtung oder Schädigung von Beschäftigten kommen außerdem Bußgeldverfahren und Strafanzeigen in Betracht. (S. 10)"},

{wb:"1.05",frage:"Ein kommunales Wasserwerk geht davon aus, automatisch bei der regionalen Unfallkasse versichert zu sein, weil es der Gemeinde gehört. Welche Aussage entspricht dem Wissensbaustein?",antworten:["Alle kommunalen Betriebe gehören unabhängig von ihrer Tätigkeit zwingend zur regionalen Unfallkasse","Kommunale Versorgungsunternehmen gehören grundsätzlich zur landwirtschaftlichen Unfallversicherung","Kommunale Verkehrs- und Versorgungsunternehmen sind von der beschriebenen Zuständigkeit der Unfallversicherungsträger der öffentlichen Hand ausgenommen; für sie ist die jeweilige Berufsgenossenschaft zuständig"],richtig:2,erklaerung:"Obwohl Einrichtungen von Bund, Ländern und Gemeinden grundsätzlich den Unfallversicherungsträgern der öffentlichen Hand zugeordnet werden, nennt der Wissensbaustein Ausnahmen. Kommunale Verkehrs- und Versorgungsunternehmen, beispielsweise Wasserwerke, gehören zur zuständigen Berufsgenossenschaft. (S. 13)"},

{wb:"1.05",frage:"Ein privatwirtschaftlicher Gartenbaubetrieb möchte wissen, welcher Bereich der gesetzlichen Unfallversicherung für ihn zuständig ist. Welche Zuordnung ist richtig?",antworten:["Die Sozialversicherung für Landwirtschaft, Forsten und Gartenbau (SVLFG)","Grundsätzlich die regionale Unfallkasse des Bundeslandes","Ausschließlich die Deutsche Gesetzliche Unfallversicherung als unmittelbarer Versicherungsträger"],richtig:0,erklaerung:"Privatwirtschaftliche Betriebe aus Landwirtschaft, Forsten und Gartenbau gehören zur SVLFG. Sie übernimmt neben weiteren Sozialversicherungsaufgaben die landwirtschaftliche Unfallversicherung. Die SVLFG ist als eigener Bereich von den gewerblichen Berufsgenossenschaften und Unfallversicherungsträgern der öffentlichen Hand zu unterscheiden. (S. 12, 14)"},

{wb:"1.05",frage:"Ein Beschäftigter kann nach einem anerkannten Arbeitsunfall seine bisherige Tätigkeit nicht mehr ausüben. Eine Umschulung soll ihm eine neue berufliche Perspektive eröffnen. Welchem Aufgabenbereich ist diese Maßnahme zuzuordnen?",antworten:["Der Prävention, weil damit ausschließlich zukünftige Arbeitsunfälle verhindert werden sollen","Der beruflichen Rehabilitation, weil die Wiedereingliederung unter Berücksichtigung von Eignung, Neigung und bisheriger Tätigkeit unterstützt wird","Der Marktüberwachung, weil die berufliche Eignung durch eine staatliche Aufsichtsbehörde geprüft werden muss"],richtig:1,erklaerung:"Die berufliche Rehabilitation umfasst die Berufshilfe zur Wiedereingliederung verletzter oder erkrankter Versicherter in das Arbeitsleben. Dabei sollen Eignung, Neigung und bisherige Tätigkeit berücksichtigt werden. Schulungsmaßnahmen können durch ergänzende Leistungen unterstützt werden. (S. 17)"},

{wb:"1.05",frage:"Ein Beschäftigter ist nach einem anerkannten Arbeitsunfall längere Zeit arbeitsunfähig und erhält eine finanzielle Leistung. Welche Leistung nennt der Wissensbaustein für diesen Fall?",antworten:["Übergangsgeld ausschließlich während einer regulären betrieblichen Unterweisung","Eine Waisenrente unabhängig vom Familienstand des Beschäftigten","Verletztengeld bei längerer Arbeitsunfähigkeit"],richtig:2,erklaerung:"Die gesetzliche Unfallversicherung erbringt im Versicherungsfall finanzielle Entschädigungsleistungen. Der Wissensbaustein nennt Verletztengeld bei längerer Arbeitsunfähigkeit und Übergangsgeld während der Berufshilfe. Bei eingeschränkter Erwerbsfähigkeit können Rentenleistungen hinzukommen. (S. 17)"},

{wb:"1.05",frage:"Eine Aufsichtsperson des Unfallversicherungsträgers stellt bei einer Betriebsbesichtigung eine unmittelbar gefährliche Maschine fest. Welche Maßnahme ist nach dem Wissensbaustein möglich?",antworten:["Bei Gefahr im Verzug kann sie mit sofortiger Wirkung die Stilllegung der Maschine oder das Stoppen eines Arbeitsverfahrens anordnen","Sie darf ausschließlich eine unverbindliche Empfehlung aussprechen und muss zunächst den nächsten regulären Beratungstermin abwarten","Sie darf nur dann eingreifen, wenn bereits ein Versicherungsfall eingetreten und eine Entschädigung bewilligt worden ist"],richtig:0,erklaerung:"Aufsichtspersonen können bei Sicherheitsmängeln Anordnungen zur Durchführung von Unfallverhütungsvorschriften erlassen. Bei Gefahr im Verzug dürfen sie mit sofortiger Wirkung Arbeitsverfahren stoppen oder Maschinen stilllegen lassen. Diese Eingriffsbefugnisse ergänzen ihre vorrangige Beratungsaufgabe. (S. 18–19)"},

{wb:"1.05",frage:"Eine Fachkraft für Arbeitssicherheit sucht Unterstützung bei einer schwierigen Lärmmessung und bei der Einführung neuer Arbeitsverfahren. Welche Stelle kann nach dem Wissensbaustein geeignete Unterstützung leisten?",antworten:["Ausschließlich das Gewerbeamt im Rahmen einer erneuten Gewerbeanmeldung","Der zuständige Unfallversicherungsträger durch Beratung seiner Aufsichtspersonen und gegebenenfalls messtechnische Dienste","Ausschließlich die Nationale Arbeitsschutzkonferenz durch einen Beschluss über den Einzelfall"],richtig:1,erklaerung:"Unfallversicherungsträger beraten ihre Mitgliedsbetriebe bei der Einführung neuer Technologien, der Umgestaltung von Arbeitsverfahren und weiteren Arbeitsschutzfragen. Zusätzlich bieten sie messtechnische Dienste an, beispielsweise zur Messung von Lärm oder Gefahrstoffen. (S. 17–18)"},

{wb:"1.05",frage:"Ein Unternehmen möchte seine betriebliche Erste-Hilfe-Organisation verbessern und geeignete Beschäftigte ausbilden lassen. Welche Unterstützung beschreibt der Wissensbaustein?",antworten:["Die BAuA übernimmt sämtliche Erste-Hilfe-Leistungen unmittelbar im Betrieb und ersetzt damit die betriebliche Organisation","Die staatliche Gewerbeaufsicht finanziert grundsätzlich sämtliche Erste-Hilfe-Ausbildungen aus Beiträgen der Beschäftigten","Die Unfallversicherungsträger übernehmen Ausbildungskosten für betriebliche Ersthelfende und legen Art und Umfang der Erste-Hilfe-Organisation fest"],richtig:2,erklaerung:"Zur Präventionsaufgabe der Unfallversicherungsträger gehört die Sicherstellung einer wirksamen Ersten Hilfe im Betrieb. Sie übernehmen die Ausbildungskosten für betriebliche Ersthelferinnen und Ersthelfer und legen Art und Umfang der Erste-Hilfe-Organisation fest. (S. 17)"},

{wb:"1.05",frage:"Mehrere staatliche Aufsichtsbehörden und Unfallversicherungsträger stellen fest, dass sie dieselben Betriebe häufig unabhängig voneinander kontrollieren. Welches GDA-Kernelement setzt an diesem Problem an?",antworten:["Das abgestimmte Vorgehen bei Beratung und Überwachung durch gemeinsame Grundsätze, Rahmenvereinbarungen und Informationsaustausch","Die vollständige Abschaffung der Aufsicht durch Unfallversicherungsträger zugunsten einer einzigen Bundesbehörde","Die Verlagerung sämtlicher Arbeitsschutzkontrollen auf die betriebliche Personalvertretung"],richtig:0,erklaerung:"Das zweite GDA-Kernelement soll Beratungs- und Überwachungsaktivitäten der Landesbehörden und Unfallversicherungsträger koordinieren. Dazu dienen Rahmenvereinbarungen, gemeinsame Grundsätze für planvolles Aufsichtshandeln und der Daten- und Informationsaustausch zu Betriebsbesichtigungen. Ziel sind einheitliche und nachvollziehbare Präventionsangebote. (S. 24)"},

{wb:"1.05",frage:"Eine Sifa möchte wissen, nach welchen Kriterien staatliche Aufsicht und Unfallversicherungsträger betriebliche Arbeitsschutzsituationen beurteilen. Welches Instrument der GDA bietet hierfür Orientierung?",antworten:["Die Beitragssatzungen der gesetzlichen Krankenversicherung","Die GDA-Leitlinien mit gemeinsamen Grundsätzen für Beratung, Überwachung und Bewertung betrieblicher Situationen","Die Satzung eines einzelnen Unfallversicherungsträgers als alleinige Grundlage für sämtliche staatlichen Kontrollen"],richtig:1,erklaerung:"Die GDA-Leitlinien beschreiben das Vorgehen bei Beratung und Überwachung, legen Anlässe und Umfang entsprechender Tätigkeiten fest und enthalten Kriterien zur Bewertung betrieblicher Situationen. Sie richten sich an die Aufsichtsdienste, können aber auch Betrieben und Sifas als Orientierungshilfe dienen. (S. 24)"},

{wb:"1.05",frage:"Bei der Auswertung eines GDA-Arbeitsprogramms zeigt sich, dass viele Maßnahmen durchgeführt wurden, die angestrebten Verbesserungen jedoch nur teilweise eingetreten sind. Welche Schlussfolgerung entspricht dem Evaluierungsansatz der GDA?",antworten:["Die Durchführung der Maßnahmen allein beweist bereits die vollständige Zielerreichung, sodass keine weitere Bewertung erforderlich ist","Die Bewertung darf sich ausschließlich auf die Zahl der durchgeführten Betriebsbesichtigungen beschränken","Es ist zu prüfen, ob die Maßnahmen die beabsichtigten Wirkungen entfaltet und die Arbeitsschutzziele erreicht haben; die Ergebnisse können zur Anpassung der Strategie genutzt werden"],richtig:2,erklaerung:"Die GDA bewertet nicht nur die Durchführung ihrer Aktivitäten, sondern auch deren tatsächliche Wirkungen und die Erreichung der Arbeitsschutzziele. Zusätzlich untersucht die Dachevaluation die langfristige Gesamtwirkung auf das Arbeitsschutzsystem. Auf dieser Grundlage kann die Strategie angepasst werden. (S. 25)"}, 
{wb:"1.08",frage:"Welche fünf Zweige bilden die gesetzliche Sozialversicherung in Deutschland?",antworten:["Renten-, Kranken-, Arbeitslosen-, Unfall- und Pflegeversicherung","Renten-, Kranken-, Haftpflicht-, Unfall- und Lebensversicherung","Kranken-, Unfall-, Berufsunfähigkeits-, Pflege- und Rechtsschutzversicherung"],richtig:0,erklaerung:"Die gesetzliche Sozialversicherung besteht aus fünf Zweigen: Rentenversicherung, Krankenversicherung, Arbeitslosenversicherung, Unfallversicherung und Pflegeversicherung. Sie schützt als Solidargemeinschaft vor wesentlichen Lebensrisiken. Ergänzend bestehen besondere Versorgungssysteme, etwa für Beamte und bestimmte freie Berufe. (S. 3)"},

{wb:"1.08",frage:"Welche drei Versicherungsfälle deckt die gesetzliche Unfallversicherung nach dem Wissensbaustein ab?",antworten:["Arbeitslosigkeit, Erwerbsminderung und Pflegebedürftigkeit","Arbeitsunfälle, Wegeunfälle und Berufskrankheiten","Arbeitsunfälle, sämtliche Freizeitunfälle und allgemeine Erkrankungen"],richtig:1,erklaerung:"Die gesetzliche Unfallversicherung sichert die Folgen von Arbeitsunfällen, Wegeunfällen und Berufskrankheiten ab. Voraussetzung für Leistungen ist grundsätzlich die Anerkennung eines Versicherungsfalls. Entscheidend ist der Zusammenhang mit der versicherten Tätigkeit. (S. 4–5)"},

{wb:"1.08",frage:"Welche Merkmale kennzeichnen einen Arbeitsunfall nach der Darstellung im Wissensbaustein?",antworten:["Eine längerfristige gesundheitliche Verschlechterung ohne äußeres Ereignis und unabhängig von der Tätigkeit","Jede während der Arbeitszeit bemerkte Erkrankung, sofern anschließend eine ärztliche Behandlung erfolgt","Ein plötzliches Ereignis, eine von außen auf den Körper einwirkende verletzungsbewirkende Ursache und ein direkter Zusammenhang mit der Arbeitstätigkeit"],richtig:2,erklaerung:"Ein Arbeitsunfall ist durch ein plötzliches Ereignis, einen von außen einwirkenden verletzungsbewirkenden Faktor und den Zusammenhang mit der Arbeitstätigkeit gekennzeichnet. Dieser Kausalzusammenhang ist Voraussetzung für die Anerkennung als Versicherungsfall. (S. 4)"},

{wb:"1.08",frage:"Welche rechtliche Grundlage nennt der Wissensbaustein für die gesetzliche Unfallversicherung?",antworten:["Das Siebte Buch Sozialgesetzbuch (SGB VII)","Ausschließlich das Arbeitsschutzgesetz (ArbSchG)","Das Bürgerliche Gesetzbuch (BGB) als alleinige Versicherungsgrundlage"],richtig:0,erklaerung:"Das SGB VII bildet die gesetzliche Grundlage der Unfallversicherung. Es regelt den Versicherungsschutz und die Aufgaben der gesetzlichen Unfallversicherung. Für Berufskrankheiten ist zusätzlich die Berufskrankheiten-Verordnung von Bedeutung. (S. 2–3, 5)"},

{wb:"1.08",frage:"Welche Leistungsbereiche der gesetzlichen Unfallversicherung zeigt die Übersicht auf Seite 6?",antworten:["Arbeitsvermittlung, Rentenberatung, Krankenversicherung, Gewerbeaufsicht und Marktüberwachung","Heilbehandlung, Pflege, berufliche Rehabilitation, soziale Rehabilitation und Geldleistungen","Erste-Hilfe-Ausbildung, Beitragsprüfung, Arbeitszeitkontrolle, Produktsicherheit und Gewerbeanmeldung"],richtig:1,erklaerung:"Die Abbildung auf Seite 6 stellt fünf Leistungsbereiche dar: Heilbehandlung, Pflege, berufliche Rehabilitation, soziale Rehabilitation und Geldleistungen. Sie dienen der Wiederherstellung der Gesundheit und Arbeitskraft sowie der finanziellen Absicherung der Betroffenen. (S. 6)"},

{wb:"1.08",frage:"Welches zentrale Ziel verfolgt die gesetzliche Unfallversicherung nach Eintritt eines Versicherungsfalls?",antworten:["Die ausschließliche Feststellung der betrieblichen Verantwortlichkeit für den Gesundheitsschaden","Die dauerhafte Freistellung sämtlicher betroffener Beschäftigter von beruflichen Tätigkeiten","Die Wiederherstellung von Gesundheit und Arbeitskraft durch Rehabilitation sowie die finanzielle Absicherung der Betroffenen und Hinterbliebenen"],richtig:2,erklaerung:"Nach einem anerkannten Versicherungsfall erbringt die Unfallversicherung medizinische, berufliche und soziale Rehabilitationsleistungen. Im Vordergrund steht die Wiederherstellung der Gesundheit und Arbeitskraft. Hinzu kommen finanzielle Entschädigungsleistungen für Versicherte und gegebenenfalls Hinterbliebene. (S. 6)"},

{wb:"1.08",frage:"Warum können auch geringfügig Beschäftigte, Auszubildende und Saisonarbeitskräfte unter dem Schutz der gesetzlichen Unfallversicherung stehen?",antworten:["Weil der Versicherungsschutz grundsätzlich Beschäftigte unabhängig von der konkreten Beschäftigungsform umfasst","Weil nur Beschäftigte mit einem vollständig abgeschlossenen Berufsausbildungsverhältnis versichert sind","Weil diese Personengruppen automatisch eine private Unfallversicherung durch den Arbeitgeber erhalten"],richtig:0,erklaerung:"Die gesetzliche Unfallversicherung ist eine Pflichtversicherung. Beschäftigte sind unabhängig davon versichert, ob sie in Vollzeit, Teilzeit, geringfügig, saisonal oder als Auszubildende tätig sind. Darüber hinaus gehören beispielsweise Kinder in Betreuungseinrichtungen, Schülerinnen, Schüler und Studierende zu den versicherten Personengruppen. (S. 3)"},

{wb:"1.08",frage:"Warum ist der Kausalzusammenhang zwischen Tätigkeit und Gesundheitsschaden für die Anerkennung eines Arbeitsunfalls entscheidend?",antworten:["Weil jede gesundheitliche Beeinträchtigung während eines Arbeitstages unabhängig von ihrer Ursache versichert ist","Weil ein zeitliches Zusammentreffen mit der Arbeitszeit allein nicht genügt und das Unfallereignis mit der versicherten Tätigkeit zusammenhängen muss","Weil die Anerkennung ausschließlich von der Dauer der anschließenden Arbeitsunfähigkeit abhängt"],richtig:1,erklaerung:"Ein Arbeitsunfall setzt einen direkten Zusammenhang zwischen dem Unfallereignis und der Arbeitstätigkeit voraus. Der Wissensbaustein unterscheidet deshalb beispielsweise versicherte Wege zum Essen während einer Pause von nicht versicherten Spaziergängen in der Pause. (S. 4)"},

{wb:"1.08",frage:"Weshalb können bestimmte Umwege auf dem Arbeitsweg als Wegeunfall versichert sein?",antworten:["Weil grundsätzlich sämtliche privaten Erledigungen zwischen Wohnung und Arbeitsstätte versichert sind","Weil Versicherungsschutz ausschließlich für die kürzeste denkbare Wegstrecke besteht","Weil der Versicherungsschutz neben dem direkten Arbeitsweg auch bestimmte Umwege, etwa wegen Fahrgemeinschaften oder Kinderbetreuung, einschließt"],richtig:2,erklaerung:"Der Wissensbaustein nennt neben dem direkten Weg zur oder von der Arbeit ausdrücklich bestimmte versicherte Umwege. Dazu gehören beispielsweise Wege im Zusammenhang mit Fahrgemeinschaften oder dem Bringen und Abholen von Kindern an Betreuungseinrichtungen. Nicht jeder beliebige private Umweg ist damit versichert. (S. 5)"},

{wb:"1.08",frage:"Wodurch unterscheidet sich eine Berufskrankheit typischerweise von einem Arbeitsunfall?",antworten:["Berufskrankheiten entwickeln sich häufig über längere Zeiträume durch arbeitsbedingte Einwirkungen, während Arbeitsunfälle plötzlich eintretende Ereignisse sind","Berufskrankheiten werden ausschließlich durch einmalige äußere Ereignisse verursacht, während Arbeitsunfälle langfristige Belastungen voraussetzen","Berufskrankheiten benötigen keinen Zusammenhang mit der beruflichen Tätigkeit, Arbeitsunfälle dagegen immer"],richtig:0,erklaerung:"Arbeitsunfälle sind plötzlich eintretende Ereignisse. Berufskrankheiten entwickeln sich dagegen häufig über einen längeren Zeitraum. Für die Anerkennung einer Berufskrankheit ist ebenfalls ein Kausalzusammenhang mit der versicherten Tätigkeit erforderlich. (S. 4–5)"},

{wb:"1.08",frage:"Warum kann eine bislang nicht in der Berufskrankheiten-Liste aufgeführte Erkrankung unter bestimmten Voraussetzungen dennoch anerkannt werden?",antworten:["Weil jede Erkrankung automatisch als Berufskrankheit gilt, sobald sie während einer Beschäftigung diagnostiziert wird","Weil neue medizinwissenschaftliche Erkenntnisse die Anerkennung wie eine Berufskrankheit ermöglichen können, wenn die entsprechenden Voraussetzungen erfüllt sind","Weil der Arbeitgeber jede Erkrankung durch eine interne Erklärung verbindlich zur Berufskrankheit bestimmen kann"],richtig:1,erklaerung:"Grundsätzlich sind Berufskrankheiten in der Berufskrankheiten-Liste der BKV aufgeführt. Ausnahmsweise kann eine nicht gelistete Krankheit wie eine Berufskrankheit anerkannt werden, wenn neue medizinwissenschaftliche Erkenntnisse dies rechtfertigen. Über die Anerkennung im Einzelfall entscheidet der zuständige Unfallversicherungsträger. (S. 5)"},

{wb:"1.08",frage:"Warum beschränkt sich die Heilbehandlung der gesetzlichen Unfallversicherung nicht auf die unmittelbare Erstversorgung?",antworten:["Weil die Heilbehandlung ausschließlich die spätere berufliche Umschulung umfasst","Weil nach der Erstversorgung grundsätzlich keine weiteren Leistungen der Unfallversicherung möglich sind","Weil zur Heilbehandlung auch ärztliche und zahnärztliche Versorgung, Arznei- und Hilfsmittel, Krankenhausbehandlung sowie medizinische Rehabilitation gehören"],richtig:2,erklaerung:"Die Heilbehandlung umfasst die Erstversorgung und weitere medizinisch notwendige Maßnahmen. Dazu zählen ärztliche und zahnärztliche Behandlung, Heil- und Hilfsmittel, häusliche Krankenpflege, Krankenhausbehandlung und medizinische Rehabilitation einschließlich Belastungserprobung und Arbeitstherapie. (S. 6)"},

{wb:"1.08",frage:"Wie unterscheiden sich berufliche und soziale Rehabilitation nach dem Wissensbaustein?",antworten:["Die berufliche Rehabilitation unterstützt die dauerhafte Wiedereingliederung in das Berufsleben; die soziale Rehabilitation umfasst ergänzende Leistungen wie Lernmittel, Prüfungsgebühren oder Unterbringungskosten","Die berufliche Rehabilitation betrifft ausschließlich medizinische Operationen; die soziale Rehabilitation umfasst ausschließlich Rentenzahlungen","Die berufliche Rehabilitation wird ausschließlich durch den Arbeitgeber finanziert; die soziale Rehabilitation ausschließlich durch private Versicherungen"],richtig:0,erklaerung:"Berufliche Rehabilitation soll Betroffene unter Berücksichtigung ihrer Eignung, Neigung und bisherigen Tätigkeit wieder in das Berufsleben eingliedern. Ergänzend übernimmt die Unfallversicherung im Bereich der sozialen Rehabilitation beispielsweise Schulungsgebühren, Lernmittel, Prüfungsgebühren und Unterbringungskosten. (S. 7)"},

{wb:"1.08",frage:"Welcher Unterschied besteht zwischen Verletztengeld und Übergangsgeld?",antworten:["Verletztengeld wird ausschließlich an Hinterbliebene gezahlt, Übergangsgeld ausschließlich bei dauerhafter Erwerbsunfähigkeit","Verletztengeld sichert Arbeitsunfähige während der Heilbehandlung finanziell ab; Übergangsgeld wird während Maßnahmen der beruflichen Wiedereingliederung gezahlt","Verletztengeld dient ausschließlich der Finanzierung von Pflegeleistungen, Übergangsgeld ausschließlich der Erstattung von Fahrtkosten"],richtig:1,erklaerung:"Verletztengeld wird bei unfall- oder berufskrankheitsbedingter Arbeitsunfähigkeit während der Heilbehandlung gezahlt. Während Maßnahmen zur beruflichen Wiedereingliederung erhalten Versicherte Übergangsgeld. Der Wissensbaustein nennt für beide Leistungen unterschiedliche Berechnungsgrundlagen. (S. 7)"},

{wb:"1.08",frage:"Welche Voraussetzungen nennt der Wissensbaustein für eine Verletztenrente bei teilweiser Minderung der Erwerbsfähigkeit?",antworten:["Jede vorübergehende Arbeitsunfähigkeit von mindestens drei Tagen unabhängig vom Ausmaß der Erwerbsminderung","Eine Minderung der Erwerbsfähigkeit um mindestens zehn Prozent während einer einzigen Arbeitswoche","Eine länger als 26 Wochen bestehende Minderung der Erwerbsfähigkeit um mindestens 20 Prozent infolge eines Arbeitsunfalls oder einer Berufskrankheit"],richtig:2,erklaerung:"Nach dem Wissensbaustein besteht ein Anspruch auf Verletztenrente, wenn die Erwerbsfähigkeit infolge eines Arbeitsunfalls oder einer Berufskrankheit länger als 26 Wochen um mindestens 20 Prozent gemindert ist. Bei vollständigem Verlust der Erwerbsfähigkeit wird eine Vollrente, bei teilweiser Minderung eine Teilrente beschrieben. (S. 7)"},

{wb:"1.08",frage:"Warum ist bei schweren Arbeitsunfällen ein zeitgleiches Vorgehen nach der Rettungskette erforderlich?",antworten:["Weil Sofortmaßnahmen, Notruf, weitergehende Erste Hilfe und professionelle medizinische Versorgung koordiniert ineinandergreifen müssen","Weil zunächst sämtliche Unfallanzeigen abgeschlossen sein müssen, bevor medizinische Hilfe geleistet werden darf","Weil die Rettungskette ausschließlich der späteren versicherungsrechtlichen Anerkennung des Unfallereignisses dient"],richtig:0,erklaerung:"Die Rettungskette soll eine schnelle und lückenlose Notfallversorgung gewährleisten. Die Abbildung zeigt Sofortmaßnahmen, Notruf, weitergehende Erste-Hilfe-Maßnahmen, Rettungsdienst und notärztliche Versorgung sowie Klinik beziehungsweise Durchgangsarzt. Erste Hilfe und Alarmierung des Rettungsdienstes erfolgen bei schweren Verletzungen zeitgleich. (S. 8)"},

{wb:"1.08",frage:"Warum ist die Unfallanzeige für die präventive Arbeit der Fachkraft für Arbeitssicherheit bedeutsam?",antworten:["Weil sie ausschließlich die spätere Berechnung des Verletztengeldes ermöglicht","Weil der dokumentierte Unfallhergang Hinweise auf Unfallursachen liefert und als Ausgangspunkt für rückschauende Gefährdungsermittlung und Präventionsmaßnahmen dient","Weil mit der Unfallanzeige die Verantwortung für sämtliche zukünftigen Schutzmaßnahmen auf den Unfallversicherungsträger übergeht"],richtig:1,erklaerung:"Die Unfallanzeige enthält unter anderem eine Schilderung des Unfallhergangs. Dieser Bericht kann Hinweise auf die Gefahrenquelle und die Entstehung des Unfalls liefern. Für die Sifa bildet er deshalb eine wichtige Grundlage zur rückschauenden Gefährdungsermittlung und zur Entwicklung vorbeugender Maßnahmen. (S. 9)"},

{wb:"1.08",frage:"Weshalb genügt bereits der Verdacht einer Berufskrankheit für eine Anzeige?",antworten:["Weil eine Berufskrankheit erst nach vollständiger beruflicher Rehabilitation gemeldet werden darf","Weil jede Verdachtsanzeige automatisch die endgültige Anerkennung als Berufskrankheit bewirkt","Weil die niedrige Anzeigeschwelle ein frühzeitiges vorbeugendes Eingreifen und die Prüfung des möglichen beruflichen Zusammenhangs ermöglichen soll"],richtig:2,erklaerung:"Bei Berufskrankheiten liegt die Anzeigeschwelle bewusst niedrig. Schon der Verdacht reicht aus, damit eine Meldung erfolgen kann. Dadurch sollen frühzeitig Ermittlungen sowie erforderliche Präventions- und Schutzmaßnahmen ermöglicht werden. Die Anerkennung erfolgt erst im anschließenden Feststellungsverfahren. (S. 9–10)"},

{wb:"1.08",frage:"Warum ist bei bestimmten Unfallverletzungen die Vorstellung bei einem Durchgangsarzt erforderlich?",antworten:["Weil das Durchgangsarztverfahren die besondere unfallmedizinische Beurteilung und Steuerung der weiteren Behandlung sicherstellt","Weil ausschließlich Durchgangsärzte die betriebliche Unfallanzeige unterschreiben dürfen","Weil jede noch so geringfügige Verletzung zwingend eine stationäre Behandlung in einer Spezialklinik voraussetzt"],richtig:0,erklaerung:"Das Durchgangsarztverfahren dient der qualifizierten unfallmedizinischen Versorgung. Es ist nach dem Wissensbaustein unter anderem erforderlich, wenn Arbeitsunfähigkeit über den Unfalltag hinaus besteht, die Behandlung voraussichtlich länger als eine Woche dauert, Heil- oder Hilfsmittel zu verordnen sind oder eine Wiedererkrankung aufgrund von Unfallfolgen vorliegt. (S. 9)"},

{wb:"1.08",frage:"Worin unterscheiden sich die Feststellungsverfahren bei Arbeitsunfällen und Berufskrankheiten?",antworten:["Bei Arbeitsunfällen ist grundsätzlich ein gesonderter Antrag der versicherten Person erforderlich, während Berufskrankheiten ohne Prüfung anerkannt werden","Bei Arbeitsunfällen werden Unfallanzeige und ärztliche Berichte ausgewertet; bei Berufskrankheiten sind zusätzlich insbesondere Krankheitsbild, berufliche Einwirkungen und deren Kausalzusammenhang zu untersuchen","Bei Berufskrankheiten entscheidet ausschließlich der Arbeitgeber über die Anerkennung, während Arbeitsunfälle nur durch staatliche Gewerbeärzte beurteilt werden"],richtig:1,erklaerung:"Bei Arbeitsunfällen beginnt die Untersuchung durch den Unfallversicherungsträger nach Eingang der Unfallanzeige und ärztlicher Berichte. Bei Berufskrankheiten wird zusätzlich geprüft, ob die Erkrankung in der BKV-Liste enthalten ist beziehungsweise wie eine Berufskrankheit behandelt werden kann und ob ein ursächlicher Zusammenhang mit beruflichen Einwirkungen besteht. (S. 10–12)"},

{wb:"1.08",frage:"Warum wird bei der Prüfung einer möglichen Berufskrankheit auch die betriebliche Gefährdungsermittlung herangezogen?",antworten:["Weil eine Berufskrankheit allein durch das Vorhandensein einer allgemeinen Gefährdungsbeurteilung nachgewiesen ist","Weil medizinische Befunde bei Berufskrankheiten grundsätzlich keine Rolle spielen","Weil die festgestellten beruflichen Einwirkungen mit medizinischen Befunden und weiteren Informationen zusammengeführt werden müssen, um den Kausalzusammenhang zu beurteilen"],richtig:2,erklaerung:"Der Unfallversicherungsträger untersucht Diagnose, Verlauf und gesundheitliche Vorgeschichte und verbindet diese Erkenntnisse mit der Gefährdungsermittlung am Arbeitsplatz. Dabei können Sifa, Betriebsarzt, Vorgesetzte, Beschäftigte und Personalvertretung mitwirken. Ziel ist die fundierte Beurteilung des beruflichen Zusammenhangs. (S. 10–11)"},

{wb:"1.08",frage:"Ein Beschäftigter stürzt auf dem direkten Weg von seiner Wohnung zur Arbeitsstätte und verletzt sich. Welche Einordnung ist nach dem Wissensbaustein zutreffend?",antworten:["Es kommt ein Wegeunfall als Versicherungsfall der gesetzlichen Unfallversicherung in Betracht","Es liegt grundsätzlich ein unversicherter Freizeitunfall vor, weil das Betriebsgelände noch nicht erreicht wurde","Es handelt sich automatisch um eine Berufskrankheit, weil der Weg regelmäßig zurückgelegt wird"],richtig:0,erklaerung:"Unfälle auf dem direkten Weg zur oder von der Arbeit sind grundsätzlich als Wegeunfälle vom Versicherungsschutz erfasst. Wegeunfälle gehören neben Arbeitsunfällen und Berufskrankheiten zu den Versicherungsfällen der gesetzlichen Unfallversicherung. (S. 4–5)"},

{wb:"1.08",frage:"Eine Beschäftigte verletzt sich während ihrer Pause auf dem Weg zur Betriebskantine. Ein Kollege verletzt sich dagegen bei einem privaten Spaziergang in derselben Pause. Welche Bewertung entspricht dem Wissensbaustein?",antworten:["Beide Ereignisse sind allein aufgrund der zeitlichen Lage in der Arbeitspause gleichermaßen versichert","Der Weg zum Essen kann versichert sein, während ein privater Spaziergang in der Pause nach der Darstellung nicht unter diesen Versicherungsschutz fällt","Beide Ereignisse sind grundsätzlich unversichert, weil der Versicherungsschutz während jeder Arbeitspause vollständig ruht"],richtig:1,erklaerung:"Der Wissensbaustein unterscheidet ausdrücklich zwischen einem Unfall auf dem Weg zum Essen, beispielsweise zur Kantine, und einem Unfall bei einem Spaziergang während der Pause. Der Weg zum Essen kann versichert sein, der private Spaziergang dagegen nicht. Maßgeblich ist der Zusammenhang mit der versicherten Tätigkeit. (S. 4)"},

{wb:"1.08",frage:"Ein Beschäftigter entwickelt nach langjähriger beruflicher Lärmeinwirkung eine Hörschädigung. Welche Aussage ist für die mögliche Anerkennung als Berufskrankheit entscheidend?",antworten:["Die Anerkennung erfolgt automatisch, sobald der Beschäftigte länger als zehn Jahre im selben Betrieb gearbeitet hat","Eine Hörschädigung kann ausschließlich dann versichert sein, wenn sie durch ein einzelnes plötzliches Unfallereignis ausgelöst wurde","Es muss geprüft werden, ob die Erkrankung die Voraussetzungen einer Berufskrankheit erfüllt und ein ursächlicher Zusammenhang mit den beruflichen Einwirkungen besteht"],richtig:2,erklaerung:"Lärmschwerhörigkeit wird im Wissensbaustein als häufige anerkannte Berufskrankheit genannt. Die Anerkennung setzt jedoch eine Prüfung der Erkrankung und des Kausalzusammenhangs zur beruflichen Tätigkeit voraus. Dazu werden medizinische Befunde und die tatsächlichen Arbeitsplatzbelastungen untersucht. (S. 5, 10–11)"},

{wb:"1.08",frage:"Ein Arbeitnehmer kann nach einem anerkannten Arbeitsunfall seine bisherige körperlich belastende Tätigkeit nicht mehr ausüben. Eine Umschulung erscheint geeignet. Welche Leistung ist vorrangig einschlägig?",antworten:["Berufliche Rehabilitation einschließlich Berufsvorbereitung, Berufsfindung oder Umschulung","Ausschließlich Pflegegeld, unabhängig davon, ob im Alltag fremde Hilfe benötigt wird","Ausschließlich Hinterbliebenenleistungen, weil die bisherige Tätigkeit nicht fortgesetzt werden kann"],richtig:0,erklaerung:"Kann die bisherige Arbeitstätigkeit infolge eines Versicherungsfalls nicht mehr ausgeübt werden, unterstützt die gesetzliche Unfallversicherung die berufliche Wiedereingliederung. Dazu können Berufsfindung, Berufsvorbereitung und Umschulung gehören. Eignung, Neigung und bisherige Tätigkeit werden berücksichtigt. (S. 7)"},

{wb:"1.08",frage:"Eine versicherte Person benötigt infolge eines anerkannten Arbeitsunfalls dauerhaft erhebliche Unterstützung bei gewöhnlichen alltäglichen Verrichtungen. Welche Leistung kommt nach dem Wissensbaustein in Betracht?",antworten:["Ausschließlich Übergangsgeld während einer beruflichen Umschulung","Pflegegeld beziehungsweise die Übernahme von Kosten für häusliche Pflege oder Pflege in einem Heim","Ausschließlich die Erstattung betrieblicher Erste-Hilfe-Ausbildungskosten"],richtig:1,erklaerung:"Die Unfallversicherung erbringt Pflegeleistungen, wenn Betroffene infolge eines Arbeitsunfalls oder einer Berufskrankheit alltägliche Verrichtungen nicht mehr selbstständig ausführen können und in erheblichem Umfang fremde Hilfe benötigen. Möglich sind Pflegegeld, häusliche Pflege oder Pflege in einem Heim. (S. 7)"},

{wb:"1.08",frage:"Ein Beschäftigter erleidet einen schweren Arbeitsunfall. Während Ersthelfende die Versorgung beginnen, diskutiert eine Führungskraft zunächst über die Unfallanzeige. Welches Vorgehen hat Vorrang?",antworten:["Zunächst muss die vollständige Unfallanzeige unterschrieben werden, damit der Rettungsdienst verständigt werden darf","Die versicherungsrechtliche Anerkennung muss abgewartet werden, bevor medizinische Maßnahmen beginnen","Die sofortige Erste Hilfe und parallele Alarmierung des Rettungsdienstes nach der Rettungskette haben Vorrang vor der späteren Unfallanzeige"],richtig:2,erklaerung:"Bei einem schweren Arbeitsunfall steht die medizinische Versorgung an erster Stelle. Ersthelfende leiten Sofortmaßnahmen ein, während gleichzeitig der Notruf erfolgt. Die Rettungskette gewährleistet die weitere Versorgung durch Rettungsdienst und gegebenenfalls Klinik. Die Unfallanzeige ist eine nachgelagerte Pflicht. (S. 8–9)"},

{wb:"1.08",frage:"Nach einem Arbeitsunfall ist ein Beschäftigter voraussichtlich fünf Tage arbeitsunfähig. Welche Meldepflicht beschreibt der Wissensbaustein?",antworten:["Der Arbeitgeber muss bei einer Arbeitsunfähigkeit von mehr als drei Tagen spätestens drei Tage nach dem Ereignis eine Unfallanzeige erstatten und die zuständige Landesbehörde informieren","Eine Unfallanzeige ist erst erforderlich, wenn die Arbeitsunfähigkeit länger als 26 Wochen besteht","Die Meldung darf ausschließlich durch den verletzten Beschäftigten nach Abschluss der Heilbehandlung erfolgen"],richtig:0,erklaerung:"Nach dem Wissensbaustein muss der Arbeitgeber einen Arbeitsunfall mit mehr als drei Tagen Arbeitsunfähigkeit spätestens drei Tage nach dem Ereignis beim Unfallversicherungsträger anzeigen und auch der zuständigen Arbeitsschutzbehörde des Landes melden. Der Personal- beziehungsweise Betriebsrat muss die Anzeige ebenfalls unterschreiben. (S. 9)"},

{wb:"1.08",frage:"Bei einem Arbeitsunfall werden mehrere Beschäftigte schwer verletzt. Welche besondere Meldeanforderung nennt der Wissensbaustein?",antworten:["Eine Meldung ist erst nach Abschluss sämtlicher ärztlicher Behandlungen erforderlich","Tödliche Unfälle, Massenunfälle und Unfälle mit schwerwiegenden Gesundheitsschäden müssen dem Unfallversicherungsträger und der zuständigen Landesbehörde sofort gemeldet werden","Die Meldung erfolgt ausschließlich an die Personalvertretung, weil mehrere Beschäftigte betroffen sind"],richtig:1,erklaerung:"Der Wissensbaustein unterscheidet die reguläre Unfallanzeige von besonders schweren Ereignissen. Tödliche Unfälle, Massenunfälle und Unfälle mit schwerwiegenden Gesundheitsschäden sind sofort dem Unfallversicherungsträger und der zuständigen Landesbehörde zu melden. (S. 9)"},

{wb:"1.08",frage:"Eine Ärztin vermutet bei einer Beschäftigten eine berufsbedingte Hauterkrankung. Die endgültige Diagnose und der berufliche Kausalzusammenhang sind noch nicht geklärt. Was ist hinsichtlich der Anzeige richtig?",antworten:["Die Anzeige darf erst nach einem abschließenden Gutachten und einer rechtskräftigen Anerkennung erfolgen","Ausschließlich der Arbeitgeber darf eine Berufskrankheit anzeigen; ärztliche Meldungen sind ausgeschlossen","Bereits der Verdacht genügt für eine Anzeige, die unter anderem durch die Ärztin, den Arbeitgeber oder die versicherte Person erfolgen kann"],richtig:2,erklaerung:"Die Anzeigeschwelle für Berufskrankheiten ist bewusst niedrig. Bereits ein begründeter Verdacht ermöglicht eine Meldung. Nach dem Wissensbaustein können Arbeitgeber, Ärztinnen und Ärzte sowie Versicherte selbst eine entsprechende Anzeige veranlassen. Die Prüfung erfolgt anschließend durch den Unfallversicherungsträger. (S. 9)"},

{wb:"1.08",frage:"Nach einem Arbeitsunfall ist absehbar, dass die notwendige ärztliche Behandlung länger als eine Woche dauern wird. Welches Vorgehen entspricht dem Wissensbaustein?",antworten:["Die verletzte Person soll im Durchgangsarztverfahren vorgestellt werden, damit die weitere unfallmedizinische Behandlung beurteilt und gesteuert werden kann","Die Behandlung muss ausschließlich durch den betrieblichen Ersthelfer fortgeführt werden, solange keine dauerhafte Erwerbsminderung festgestellt ist","Eine Vorstellung beim Durchgangsarzt ist erst nach Abschluss des Feststellungsverfahrens zulässig"],richtig:0,erklaerung:"Ein Durchgangsarztverfahren ist unter anderem erforderlich, wenn die Behandlung voraussichtlich länger als eine Woche dauert oder die Verletzung über den Unfalltag hinaus Arbeitsunfähigkeit verursacht. Auch bei bestimmten Heil- und Hilfsmitteln oder Wiedererkrankungen aufgrund von Unfallfolgen ist es vorgesehen. (S. 9)"},

{wb:"1.08",frage:"Eine Beschäftigte erleidet bei einem Arbeitsunfall eine schwere Amputationsverletzung. Welche Besonderheit der medizinischen Versorgung beschreibt der Wissensbaustein?",antworten:["Die Behandlung erfolgt grundsätzlich ausschließlich durch den nächstgelegenen Allgemeinarzt ohne weitere Überweisung","Bei Verletzungen, die dem Verletzungsartenverfahren unterliegen, muss unverzüglich eine Überweisung an ein entsprechendes Spezialkrankenhaus erfolgen","Eine Spezialbehandlung ist erst möglich, wenn eine Verletztenrente bewilligt wurde"],richtig:1,erklaerung:"Schwere Verletzungen, beispielsweise Amputationsverletzungen, können eine unmittelbare Behandlung in spezialisierten Krankenhäusern erfordern. Der Wissensbaustein nennt hierfür das Verletzungsartenverfahren. Bei Zweifeln an der Transportfähigkeit soll ärztlich über Art und Durchführung des Transports entschieden werden. (S. 10)"},

{wb:"1.08",frage:"Ein Arbeitgeber geht davon aus, dass der Unfallversicherungsträger einen Arbeitsunfall nur untersucht, wenn der Verletzte ausdrücklich einen Leistungsantrag stellt. Welche Bewertung ist richtig?",antworten:["Die Annahme ist zutreffend, weil ohne Antrag keine Unfallanzeige ausgewertet werden darf","Die Annahme ist zutreffend, sofern die Arbeitsunfähigkeit weniger als 26 Wochen beträgt","Die Annahme ist unzutreffend, weil das Feststellungsverfahren nach Eingang der erforderlichen Unfall- und ärztlichen Unterlagen eingeleitet wird und kein gesonderter Antrag der Versicherten erforderlich ist"],richtig:2,erklaerung:"Das Feststellungsverfahren beginnt, sobald dem Unfallversicherungsträger die Unfallanzeige und der Bericht des Durchgangsarztes beziehungsweise der Unfallklinik vorliegen. Es wird geprüft, ob ein Versicherungsfall besteht. Ein gesonderter Antrag der versicherten Person oder ihrer Angehörigen ist nicht erforderlich. (S. 10)"},

{wb:"1.08",frage:"Bei der Prüfung einer möglichen Berufskrankheit stellt sich heraus, dass die Erkrankung nicht in der Berufskrankheiten-Liste aufgeführt ist. Welcher Prüfschritt ergibt sich aus dem Ablaufdiagramm?",antworten:["Es wird geprüft, ob die Erkrankung aufgrund der Voraussetzungen dennoch wie eine Berufskrankheit behandelt werden kann","Die Erkrankung wird ohne weitere Prüfung automatisch als Arbeitsunfall anerkannt","Das Verfahren wird grundsätzlich unabhängig von neuen medizinwissenschaftlichen Erkenntnissen sofort beendet"],richtig:0,erklaerung:"Das Ablaufdiagramm auf Seite 12 sieht bei einer nicht gelisteten Erkrankung die Prüfung vor, ob sie wie eine Berufskrankheit behandelt werden kann. Der Text erläutert, dass dies ausnahmsweise bei entsprechenden neuen medizinwissenschaftlichen Erkenntnissen möglich ist. Andernfalls erfolgt eine Ablehnung. (S. 5, 12)"},

{wb:"1.08",frage:"Im Feststellungsverfahren einer Berufskrankheit liegen medizinische Befunde und Arbeitsplatzdaten vor. Welche weiteren Informationen können zur Beurteilung herangezogen werden?",antworten:["Ausschließlich die private Einschätzung der versicherten Person ohne zusätzliche betriebliche Erkenntnisse","Informationen von Vorgesetzten, Kolleginnen und Kollegen, Personalvertretung sowie eine Stellungnahme des Aufsichtsdienstes des Unfallversicherungsträgers","Ausschließlich die Beitragsabrechnungen des Arbeitgebers, weil sie die berufliche Einwirkung vollständig nachweisen"],richtig:1,erklaerung:"Der Unfallversicherungsträger führt medizinische Erkenntnisse mit der betrieblichen Gefährdungsermittlung zusammen. Dabei können Vorgesetzte, Kolleginnen und Kollegen und die Personalvertretung einbezogen werden. Zusätzlich wird regelmäßig eine Stellungnahme des Aufsichtsdienstes eingeholt. (S. 10–11)"},

{wb:"1.08",frage:"Ein Unfallversicherungsträger lehnt die Anerkennung einer vermuteten Berufskrankheit ab. Welche Möglichkeit steht der versicherten Person nach dem Wissensbaustein offen?",antworten:["Die Ablehnung ist endgültig und kann grundsätzlich nicht überprüft werden","Ausschließlich der Arbeitgeber kann eine erneute Entscheidung beantragen","Die versicherte Person kann gegen die Entscheidung vorgehen, insbesondere durch Widerspruch und gegebenenfalls Klage beim Sozialgericht"],richtig:2,erklaerung:"Der Wissensbaustein beschreibt ein Widerspruchsrecht bei negativer Entscheidung. Der Widerspruchsausschuss kann den Sachverhalt überprüfen. Gegen eine ablehnende Entscheidung besteht außerdem die Möglichkeit, vor dem Sozialgericht Klage zu erheben. Die Kernaussagen bestätigen diese Rechtsmittel ausdrücklich. (S. 11, 13)"}
];

/* ============================================================
   ANWENDUNGSLOGIK – normalerweise nicht ändern
   ============================================================ */
const $ = id => document.getElementById(id);
const selected = new Set();
let quizQuestions = [], quizAnswers = [], current = 0, mode = "lernen", revealed = false;
const allKey = "ALL";
const optionKey = (type,id) => `${type}:${id}`;
function createOption(key,label,subtitle){
 const row=document.createElement('label');row.className='option';
 const cb=document.createElement('input');cb.type='checkbox';cb.value=key;cb.checked=selected.has(key);
 cb.addEventListener('change',()=>{
   if(key===allKey){selected.clear();if(cb.checked)selected.add(allKey)}
   else{selected.delete(allKey);if(cb.checked)selected.add(key);else selected.delete(key)}
   renderOptions();updateSelection();
 });
 const txt=document.createElement('span');txt.textContent=label;
 if(subtitle){const sub=document.createElement('span');sub.className='small';sub.textContent=` (${subtitle})`;txt.appendChild(sub)}
 row.append(cb,txt);return row;
}
function renderOptions(){
 const menu=$('optionsMenu');menu.replaceChildren();
 menu.appendChild(createOption(allKey,'Alle WBs','gesamter Fragenpool'));
 const solTitle=document.createElement('div');solTitle.className='group-title';solTitle.textContent='SOL auswählen';menu.appendChild(solTitle);
 Object.entries(SOLS).forEach(([name,wbs])=>menu.appendChild(createOption(optionKey('SOL',name),name,wbs.join(', '))));
 const wbTitle=document.createElement('div');wbTitle.className='group-title';wbTitle.textContent='Einzelne Wissensbausteine';menu.appendChild(wbTitle);
 
Object.entries(WBS).forEach(([id,title])=>menu.appendChild(createOption(optionKey('WB',id),`WB ${id}`,`${title} · ${FRAGEN.filter(q => q.wb === id).length} Fragen`)));
}
function effectiveWbs(){
 if(selected.has(allKey))return Object.keys(WBS);
 const result=new Set();
 selected.forEach(key=>{
  if(key.startsWith('WB:'))result.add(key.slice(3));
  if(key.startsWith('SOL:'))(SOLS[key.slice(4)]||[]).forEach(wb=>result.add(wb));
 });
 return Object.keys(WBS).filter(wb=>result.has(wb));
}
function updateSelection(){
 const wbs=effectiveWbs(),available=FRAGEN.filter(q=>wbs.includes(q.wb));
 const chips=$('chips');chips.replaceChildren();
 if(selected.has(allKey)){const x=document.createElement('span');x.className='chip';x.textContent='Alle WBs';chips.appendChild(x)}
 else selected.forEach(k=>{const x=document.createElement('span');x.className='chip';x.textContent=k.startsWith('WB:')?'WB '+k.slice(3):k.slice(4);chips.appendChild(x)});
 $('dropLabel').textContent=selected.size?`${selected.has(allKey)?'Alle WBs':selected.size+' Auswahl(en)'} gewählt`:'Bitte auswählen …';
 $('selectionInfo').textContent=wbs.length?`Enthaltene WBs: ${wbs.join(', ')} · ${available.length} verfügbare Fragen`:'Du kannst mehrere WBs und SOLs kombinieren.';
  updateRandomSettings();
}
function updateRandomSettings(){
  const enabled=$('randomQuestions').checked;
  $('randomSettings').classList.toggle('hidden',!enabled);
  const wbs=effectiveWbs();
  const available=FRAGEN.filter(q=>wbs.includes(q.wb));
  const count=Number($('randomCount').value);
  const valid=Number.isInteger(count)&&count>=1&&count<=available.length;
  $('randomInfo').textContent=`${available.length} Fragen aus ${wbs.filter(wb=>FRAGEN.some(q=>q.wb===wb)).length} WBs verfügbar. `+
    (valid?'Die Fragen werden möglichst gleichmäßig auf diese WBs verteilt.':`Bitte eine ganze Zahl von 1 bis ${available.length} eingeben.`);
  $('startBtn').disabled=available.length===0||(enabled&&!valid);
}
function shuffleQuestions(questions){
  const result=[...questions];
  for(let i=result.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [result[i],result[j]]=[result[j],result[i]];
  }
  return result;
}
function selectBalancedQuestions(questions,count,selectedWbs){
  const groups=selectedWbs.map(wb=>({
    wb,questions:shuffleQuestions(questions.filter(q=>q.wb===wb))
  })).filter(group=>group.questions.length>0);
  const result=[];
  let remaining=count;
  while(remaining>0){
    const eligible=shuffleQuestions(groups.filter(group=>group.questions.length>0));
    if(!eligible.length)break;
    for(const group of eligible){
      if(remaining===0)break;
      result.push(group.questions.pop());
      remaining--;
    }
  }
  return shuffleQuestions(result);
}
function show(which){['start','quiz','result'].forEach(id=>$(id).classList.toggle('hidden',id!==which))}
function startQuiz(){
  const chosen=effectiveWbs();
  const available=FRAGEN.filter(q=>chosen.includes(q.wb));
  if(!available.length)return;
  if($('randomQuestions').checked){
    const count=Number($('randomCount').value);
    if(!Number.isInteger(count)||count<1||count>available.length){
      alert(`Bitte eine ganze Zahl zwischen 1 und ${available.length} eingeben.`);
      return;
    }
    quizQuestions=selectBalancedQuestions(available,count,chosen);
  }else{
    quizQuestions=[...available];
  }
  mode=document.querySelector('input[name="mode"]:checked').value;
  quizAnswers=Array(quizQuestions.length).fill(null);current=0;revealed=false;
  $('optionsMenu').classList.remove('open');$('dropdownBtn').setAttribute('aria-expanded','false');
  show('quiz');renderQuestion();
}
function renderQuestion(){
 const q=quizQuestions[current];revealed=false;
 $('quizMeta').textContent=`Frage ${current+1} von ${quizQuestions.length} · WB ${q.wb} · ${mode==='lernen'?'Lernmodus':'Prüfungsmodus'}`;
 $('bar').style.width=`${(current/quizQuestions.length)*100}%`;
 $('questionTitle').textContent=q.frage;
 $('answers').replaceChildren();
 q.antworten.forEach((answer,i)=>{
  const label=document.createElement('label');label.className='answer';
  const input=document.createElement('input');input.type='radio';input.name='answer';input.value=i;
  input.checked=quizAnswers[current]===i;
  input.addEventListener('change',()=>{quizAnswers[current]=i});
  label.append(input,document.createTextNode(answer));$('answers').appendChild(label);
 });
 $('feedback').classList.add('hidden');$('nextBtn').textContent=mode==='lernen'?'Antwort prüfen':current===quizQuestions.length-1?'Quiz auswerten':'Nächste Frage';
}
function advance(){
 if(quizAnswers[current]===null){alert('Bitte wähle zuerst eine Antwort aus.');return}
 const q=quizQuestions[current];
 if(mode==='lernen'&&!revealed){
  revealed=true;
  const correct=quizAnswers[current]===q.richtig;
  $('feedback').className='feedback '+(correct?'good':'bad');
  $('feedback').textContent=`${correct?'Richtig!':'Leider falsch.'} Richtige Antwort: ${q.antworten[q.richtig]}. ${q.erklaerung}`;
  $('answers').querySelectorAll('input').forEach(input=>input.disabled=true);
  $('nextBtn').textContent=current===quizQuestions.length-1?'Auswertung anzeigen':'Nächste Frage';return;
 }
 current++;
 if(current>=quizQuestions.length)renderResults();else renderQuestion();
}
function renderResults(){
 show('result');const score=quizQuestions.reduce((n,q,i)=>n+(quizAnswers[i]===q.richtig?1:0),0);
 $('resultText').textContent=`${score} von ${quizQuestions.length} richtig (${Math.round(100*score/quizQuestions.length)} %).`;
 const container=$('resultDetails');container.replaceChildren();
 quizQuestions.forEach((q,i)=>{
  const div=document.createElement('div');div.className='feedback '+(quizAnswers[i]===q.richtig?'good':'bad');
  const title=document.createElement('strong');title.textContent=`${i+1}. WB ${q.wb}: ${q.frage}`;
  const p=document.createElement('p');p.textContent=`Deine Antwort: ${q.antworten[quizAnswers[i]]} · Richtige Antwort: ${q.antworten[q.richtig]}. ${q.erklaerung}`;
  div.append(title,p);container.appendChild(div);
 });
}
$('dropdownBtn').addEventListener('click',()=>{const menu=$('optionsMenu');const open=menu.classList.toggle('open');$('dropdownBtn').setAttribute('aria-expanded',String(open))});
document.addEventListener('click',e=>{if(!$('dropdown').contains(e.target)){$('optionsMenu').classList.remove('open');$('dropdownBtn').setAttribute('aria-expanded','false')}});
$('startBtn').addEventListener('click',startQuiz);
$('nextBtn').addEventListener('click',advance);
$('cancelBtn').addEventListener('click',()=>show('start'));
$('homeBtn').addEventListener('click',()=>show('start'));
$('restartBtn').addEventListener('click',startQuiz);
$('randomQuestions').addEventListener('change',updateRandomSettings);
$('randomCount').addEventListener('input',updateRandomSettings);
renderOptions();updateSelection();
</script>
</body></html>
