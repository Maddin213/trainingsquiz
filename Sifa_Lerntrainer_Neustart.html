const FRAGEN = [

{wb:"1.01", frage:"Welches grundlegende Ziel verfolgt der Arbeitsschutz über die Vermeidung unmittelbarer Gesundheitsschäden hinaus?", antworten:["Die dauerhafte Erhaltung der Beschäftigungsfähigkeit durch sichere, gesundheitsgerechte und förderliche Arbeitsbedingungen.","Die Erhaltung der Arbeitsleistung durch Anpassung der Beschäftigten an bestehende Arbeitsbedingungen.","Die Vermeidung anerkannter Berufskrankheiten als vorrangiges und abschließendes Schutzziel."], richtig:0, erklaerung:"Arbeitsschutz soll die physische und psychische Unversehrtheit bewahren und die Beschäftigungsfähigkeit dauerhaft erhalten. Er berücksichtigt auch die gesundheitsförderlichen Potenziale der Arbeit. (S. 3)"},

{wb:"1.01", frage:"Welche Merkmale bestimmen nach dem Wissensbaustein die individuellen Leistungsvoraussetzungen eines Menschen?", antworten:["Vor allem die berufliche Qualifikation und die Dauer der Betriebszugehörigkeit.","Die physischen und psychischen Eigenschaften, aus denen sich Leistungsfähigkeit und Leistungsbereitschaft ergeben.","Ausschließlich langfristig stabile Eigenschaften, die durch situative Einflüsse nicht verändert werden."], richtig:1, erklaerung:"Individuelle Leistungsvoraussetzungen umfassen physische und psychische Eigenschaften sowie Leistungsfähigkeit und Leistungsbereitschaft. Sie sind veränderlich und werden unter anderem durch langfristige und kurzfristige Faktoren beeinflusst. (S. 3, 18)"},

{wb:"1.01", frage:"Welche Definition beschreibt den Gegenstand des Arbeitsschutzes am vollständigsten?", antworten:["Die Verhütung meldepflichtiger Arbeitsunfälle und gesetzlich anerkannter Berufskrankheiten.","Die Kontrolle technischer Arbeitsmittel und die Einhaltung verbindlicher Sicherheitsvorschriften.","Die Bewahrung von Leben und Gesundheit bei der Berufsarbeit einschließlich Unfallverhütung, Vermeidung arbeitsbedingter Erkrankungen und menschengerechter Arbeitsgestaltung."], richtig:2, erklaerung:"Arbeitsschutz umfasst sämtliche Maßnahmen zur Verhütung von Unfällen und arbeitsbedingten Erkrankungen einschließlich der menschengerechten Gestaltung. Er berücksichtigt alle arbeitsbezogenen Umstände, die körperliche und psychische Gesundheit beeinflussen. (S. 4)"},

{wb:"1.01", frage:"Welche Aussage beschreibt die beiden Leitfragen des ganzheitlichen Arbeitsschutzes korrekt?", antworten:["Was macht krank? steht für Gefährdungsvermeidung; Was hält gesund? steht für die Förderung personeller und organisationaler Ressourcen.","Was macht krank? betrifft ausschließlich technische Einwirkungen; Was hält gesund? ausschließlich individuelles Gesundheitsverhalten.","Was macht krank? wird bei der Prävention betrachtet; Was hält gesund? ausschließlich nach bereits eingetretenen Erkrankungen."], richtig:0, erklaerung:"Der Schutzgedanke richtet sich auf die Vermeidung gesundheitsschädigender Einwirkungen. Der Fördergedanke stärkt Ressourcen, die Gesundheit und Wohlbefinden erhalten. Beide gehören zum ganzheitlichen Arbeitsschutz. (S. 7–8)"},

{wb:"1.01", frage:"Welche Bereiche gehören nach der zusammenfassenden Darstellung zu den grundlegenden Aufgaben des ganzheitlichen Arbeitsschutzes?", antworten:["Unfallverhütung, Kontrolle gesetzlicher Grenzwerte, Arbeitsmedizin und betriebliche Produktivitätssteigerung.","Schutz von Leben und Gesundheit, menschengerechte Arbeitsgestaltung einschließlich Gesundheitsförderung sowie Rehabilitation und Wiedereingliederung.","Technische Sicherheit, persönliche Schutzausrüstung, Verhaltensunterweisung und Entschädigung nach Berufskrankheiten."], richtig:1, erklaerung:"Die Kernaussagen nennen den Schutz von Leben und Gesundheit, die menschengerechte Gestaltung einschließlich Gesundheitsförderung sowie Rehabilitation und Reintegration. Die Darstellung auf Seite 6 ergänzt ausdrücklich die Begrenzung des Schadensausmaßes und die Stärkung gesundheitlicher Ressourcen. (S. 5–6, 17)"},

{wb:"1.01", frage:"Welche fünf Begründungszusammenhänge für den Arbeitsschutz stellt der Wissensbaustein dar?", antworten:["Technische Notwendigkeit, organisatorische Effizienz, individuelle Verantwortung, Versicherungsrecht und Gesundheitsverhalten.","Rechtliche Verpflichtung, betriebliche Unfallstatistik, medizinische Vorsorge, Qualifikationsförderung und öffentliche Kontrolle.","Ethische Verpflichtung, rechtliche Verpflichtung, Unternehmensinteressen, volkswirtschaftliche Bedeutung und ökologische Zusammenhänge."], richtig:2, erklaerung:"Die Darstellung auf Seite 16 nennt fünf Begründungszusammenhänge: humanes ethisches Anliegen, rechtliche Verpflichtung, Unternehmensinteressen, volkswirtschaftliche Bedeutung und ökologische Zusammenhänge. (S. 15–16)"},

{wb:"1.01", frage:"Weshalb ist die Anpassung der Arbeit an den Menschen ein Grundprinzip menschengerechter Arbeitsgestaltung?", antworten:["Weil Beschäftigte unterschiedliche Leistungsvoraussetzungen besitzen und Arbeitsbedingungen entsprechend gestaltet werden sollen.","Weil die Anforderungen einer Tätigkeit unabhängig von den Eigenschaften der Beschäftigten möglichst einheitlich bleiben müssen.","Weil menschengerechte Gestaltung vor allem die individuelle Leistungsbereitschaft erhöhen soll, während technische Bedingungen unverändert bleiben."], richtig:0, erklaerung:"Der Mensch steht im Mittelpunkt. Arbeitsbedingungen sollen den unterschiedlichen körperlichen und geistigen Leistungsvoraussetzungen entsprechen. Nicht der Mensch soll an ungeeignete Arbeit angepasst werden, sondern die Arbeit an den Menschen. (S. 3, 6)"},

{wb:"1.01", frage:"Wie unterscheiden sich arbeitsbedingte Erkrankungen und Berufskrankheiten?", antworten:["Jede Erkrankung, die während einer Beschäftigung auftritt, gilt als Berufskrankheit; arbeitsbedingte Erkrankungen müssen dagegen ausschließlich durch die Arbeit verursacht sein.","Arbeitsbedingte Erkrankungen können ganz oder teilweise durch Arbeitsumstände verursacht oder ungünstig beeinflusst sein; Berufskrankheiten unterliegen zusätzlichen gesetzlichen Voraussetzungen.","Arbeitsbedingte Erkrankungen bezeichnen nur kurzfristige Beeinträchtigungen, während Berufskrankheiten sämtliche langfristigen Gesundheitsstörungen umfassen."], richtig:1, erklaerung:"Nicht jede arbeitsbedingte Erkrankung ist eine Berufskrankheit. Für Berufskrankheiten gelten besondere Voraussetzungen nach SGB VII, insbesondere hinsichtlich besonderer arbeitsbedingter Einwirkungen und der medizinischen Erkenntnisse. (S. 9)"},

{wb:"1.01", frage:"Welche Aufgabe erfüllt die Beurteilung der Arbeitsbedingungen im betrieblichen Arbeitsschutz?", antworten:["Sie dient vorrangig der nachträglichen Untersuchung von Arbeitsunfällen und ersetzt die Planung neuer Arbeitsplätze.","Sie dokumentiert ausschließlich vorhandene Gefährdungen, während Belastungen und Ressourcen getrennt beurteilt werden.","Sie ist das zentrale Planungs-, Strategie- und Steuerungsinstrument, mit dem für jede Tätigkeit erforderliche Arbeitsschutzmaßnahmen bestimmt werden."], richtig:2, erklaerung:"Die Beurteilung berücksichtigt Gefährdungen, Belastungen und Ressourcen für jede Tätigkeit. Sie umfasst Ermitteln, Beurteilen und Gestalten, berücksichtigt Schutz- und Fördergedanken und ist eine dokumentationspflichtige Unternehmeraufgabe. (S. 11, 18)"},

{wb:"1.01", frage:"Welche Aussage zur Gesundheitsdefinition der WHO und zum Gesundheitsverständnis des Arbeitsschutzes trifft zu?", antworten:["Die WHO versteht Gesundheit umfassend als körperliches, geistiges und soziales Wohlbefinden; der Arbeitsschutz konzentriert sich insbesondere auf die Bewahrung der physischen und psychischen Unversehrtheit.","Die WHO definiert Gesundheit als Abwesenheit diagnostizierter Krankheiten; der Arbeitsschutz erweitert dies ausschließlich um Unfallverhütung.","Das Gesundheitsverständnis des Arbeitsschutzes berücksichtigt nur körperliche Erkrankungen, während geistiges und soziales Wohlbefinden ausschließlich der privaten Gesundheitsförderung zugeordnet werden."], richtig:0, erklaerung:"Die WHO beschreibt Gesundheit als umfassendes Wohlbefinden und nicht nur als Abwesenheit von Krankheit. Der Arbeitsschutz schützt insbesondere vor Verletzungen, Erkrankungen und Beeinträchtigungen und berücksichtigt zugleich soziale und individuelle Ressourcen. (S. 9)"},

{wb:"1.01", frage:"Welche Aussage beschreibt das Verhältnis von Arbeitsschutz und Gesundheitsförderung zutreffend?", antworten:["Jede gesundheitsfördernde Maßnahme gehört automatisch zum Arbeitsschutz, sobald Beschäftigte daran teilnehmen.","Gesundheitsförderung gehört zum Arbeitsschutz, soweit sie im Lebensbereich Erwerbsarbeit stattfindet und den Zielen des Arbeitsschutzes entspricht.","Gesundheitsförderung ist eine eigenständige Aufgabe außerhalb des Arbeitsschutzes, da sie keine unmittelbaren Gefährdungen beseitigt."], richtig:1, erklaerung:"Arbeitsschutz und Gesundheitsförderung überschneiden sich, sind aber nicht identisch. Zum Arbeitsschutz gehören gesundheitsfördernde Maßnahmen im Bereich der Erwerbsarbeit, die dessen Ziele unterstützen. Dies zeigt auch das Überschneidungsdiagramm auf Seite 10. (S. 9–10)"},

{wb:"1.01", frage:"Welche Zuordnung der Erklärungsmodelle zu den Aufgaben des Arbeitsschutzes ist korrekt?", antworten:["Das Gesundheitsschaden-Modell erklärt Ressourcenförderung; das Belastungs-Beanspruchungs-Modell beschreibt ausschließlich Unfallursachen; das Systemische Anforderungs-Ressourcen-Modell regelt die Rehabilitation.","Alle drei Modelle dienen ausschließlich der nachträglichen Erklärung bereits eingetretener Berufskrankheiten.","Gesundheitsschaden-Modell und Belastungs-Beanspruchungs-Modell helfen, Verletzungen und Beeinträchtigungen zu erklären; das Systemische Anforderungs-Ressourcen-Modell verdeutlicht das Verhältnis zwischen Anforderungen und Ressourcen."], richtig:2, erklaerung:"Das Dokument nennt Gesundheitsschaden-Modell und Belastungs-Beanspruchungs-Modell zur Erklärung gesundheitlicher Schäden und Beeinträchtigungen. Das Systemische Anforderungs-Ressourcen-Modell zeigt Ansatzpunkte zur Gesundheitsförderung. (S. 9–10)"},

{wb:"1.01", frage:"Warum gehören Erste Hilfe, Rettungskette und arbeitsmedizinische Vorsorge zum umfassenden Arbeitsschutz?", antworten:["Weil Arbeitsschutz neben der Vorbeugung auch die Begrenzung eingetretener Gesundheitsschäden und die Früherkennung gesundheitlicher Beeinträchtigungen umfasst.","Weil diese Maßnahmen die vorausschauende Gestaltung sicherer Arbeitsbedingungen vollständig ersetzen können.","Weil die Begrenzung des Schadensausmaßes ausschließlich den Unfallversicherungsträgern zugeordnet ist und nicht zur betrieblichen Prävention gehört."], richtig:0, erklaerung:"Arbeitsschutz umfasst auch Maßnahmen zur Begrenzung des Schadensausmaßes. Wirksame Erste Hilfe, eine funktionsfähige Rettungskette und die Früherkennung durch arbeitsmedizinische Vorsorge sind hierfür Beispiele. (S. 5)"},

{wb:"1.01", frage:"Wie unterscheiden sich Rehabilitation und betriebliche Wiedereingliederung hinsichtlich ihrer wesentlichen Zuständigkeiten?", antworten:["Die Rehabilitation ist ausschließlich eine betriebliche Aufgabe, während Wiedereingliederung grundsätzlich von Unfallversicherungsträgern organisiert wird.","Rehabilitationsaufgaben liegen im Wesentlichen bei den Unfallversicherungsträgern; die Wiedereingliederung in den Arbeitsprozess ist vor allem eine betriebliche Aufgabe.","Rehabilitation und Wiedereingliederung sind ausschließlich medizinische Aufgaben ohne Einfluss auf die betriebliche Arbeitsgestaltung."], richtig:1, erklaerung:"Rehabilitation kann medizinische, soziale und berufliche Maßnahmen umfassen. Ihre Aufgaben liegen wesentlich bei den Unfallversicherungsträgern. Die betriebliche Wiedereingliederung soll Beschäftigte nach Krankheit oder Unfall wieder in den Arbeitsprozess integrieren. (S. 5, 18)"},

{wb:"1.01", frage:"Welche Bedeutung haben die Gestaltungsfelder Technik, Organisation und Personal für den Schutzgedanken?", antworten:["Sie beschreiben ausschließlich Zuständigkeiten innerhalb des Unternehmens und keine Ansatzpunkte für Schutzmaßnahmen.","Technische Maßnahmen dienen der Unfallverhütung, organisatorische Maßnahmen der Gesundheitsförderung und personelle Maßnahmen ausschließlich der Rehabilitation.","Sicherheit kann durch Maßnahmen in allen drei Gestaltungsfeldern erreicht werden; der Schutzgedanke ist nicht auf technische Maßnahmen begrenzt."], richtig:2, erklaerung:"Der Schutzaspekt umfasst sicherheitstechnische Maßnahmen etwa an Arbeitsmitteln, Arbeitsstätten, Arbeitsstoffen und Verfahren. Sicherheit kann grundsätzlich auf technischer, organisatorischer und personeller Ebene gestaltet werden. (S. 7)"},

{wb:"1.01", frage:"Ein Betrieb verbessert Beteiligungsmöglichkeiten, Arbeitsorganisation und das soziale Umfeld. Welche Ressourcen werden dadurch vorrangig gestärkt?", antworten:["Organisationale Ressourcen, weil die Maßnahmen an betrieblichen Strukturen, Abläufen und Arbeitsbedingungen ansetzen.","Personelle Ressourcen, weil sämtliche Maßnahmen letztlich das Verhalten einzelner Beschäftigter beeinflussen können.","Ausschließlich medizinische Ressourcen, weil soziale Unterstützung und Beteiligung nur für die Rehabilitation bedeutsam sind."], richtig:0, erklaerung:"Organisationale Ressourcen liegen in der Gestaltung des Arbeitsplatzes, der Arbeitsorganisation, des sozialen Umfelds und der Mitwirkungsmöglichkeiten. Personelle Ressourcen sind dagegen im Menschen selbst angelegt. (S. 7)"},

{wb:"1.01", frage:"Eine Sifa empfiehlt Schulungen zur Bewältigung psychischer Belastungen und Angebote zur Stärkung körperlicher Leistungsfähigkeit. Welchem Ansatz entspricht dies?", antworten:["Der ausschließlichen Beseitigung technischer Gefährdungen durch organisatorische Maßnahmen.","Der Förderung personeller Ressourcen, die Beschäftigte bei der Bewältigung beruflicher Anforderungen unterstützen.","Der korrektiven Rehabilitation, die erst nach einer anerkannten arbeitsbedingten Erkrankung beginnen darf."], richtig:1, erklaerung:"Strategien zur Bewältigung psychischer Belastungen, gesundheitsförderliche Einstellungen und körperliche Leistungsfähigkeit werden im Dokument ausdrücklich als Beispiele zur Stärkung personeller Ressourcen genannt. (S. 7)"},

{wb:"1.01", frage:"Ein Unternehmen bietet Gesundheitskurse an, lässt Beschäftigte aber nicht an der Gestaltung ihrer Arbeitsbedingungen mitwirken. Welcher zentrale Grundsatz wird dadurch unzureichend berücksichtigt?", antworten:["Der Grundsatz, dass Gesundheitsförderung ausschließlich durch medizinische Fachkräfte erfolgen darf.","Der Grundsatz, dass individuelle Gesundheitskompetenz die Gestaltung der Arbeitsbedingungen ersetzt.","Der Grundsatz, Beschäftigte als selbstbestimmte und handelnde Subjekte angemessen an der Gestaltung ihrer Arbeitsbedingungen zu beteiligen."], richtig:2, erklaerung:"Gesundheitsförderung soll Beschäftigte zu mehr Selbstbestimmung über ihre Gesundheit befähigen. Sie sind keine passiven Objekte von Maßnahmen, sondern sollen als Mitgestaltende einbezogen werden. (S. 9–10)"},

{wb:"1.01", frage:"Bei der Gestaltung eines neuen Arbeitsplatzes wird die Tätigkeit so angepasst, dass qualifizierte Beschäftigte mit unterschiedlichen körperlichen Voraussetzungen sie ausüben können. Welches Grundprinzip wird umgesetzt?", antworten:["Menschengerechte Arbeitsgestaltung, die individuelle Leistungsvoraussetzungen berücksichtigt und Diskriminierung vermeidet.","Eine leistungsorientierte Personalauswahl, bei der nur Beschäftigte mit identischen körperlichen Voraussetzungen berücksichtigt werden.","Eine nachträgliche Kompensation individueller Leistungsunterschiede, ohne die Arbeitsbedingungen selbst zu verändern."], richtig:0, erklaerung:"Menschengerechte Arbeitsgestaltung passt die Arbeit an den Menschen an. Sie berücksichtigt körperliche und geistige Voraussetzungen, achtet die Menschenwürde und unterstützt Inklusion und den langfristigen Erhalt der Arbeitsfähigkeit. (S. 3, 6)"},

{wb:"1.01", frage:"Eine Tätigkeit verursacht keine nachweisbaren Gesundheitsschäden, ist aber dauerhaft kaum zumutbar und bietet keine Entwicklungsmöglichkeiten. Wie ist sie nach dem Glossar einzuordnen?", antworten:["Sie ist menschengerecht, solange keine arbeitsbedingte Erkrankung nachgewiesen werden kann.","Sie erfüllt nicht alle Anforderungen menschengerechter Gestaltung, die auch Ausführbarkeit, Erträglichkeit, Zumutbarkeit und Persönlichkeitsförderlichkeit umfasst.","Sie gilt als menschengerecht, wenn Beschäftigte durch Unterweisung ihre Leistungsbereitschaft entsprechend erhöhen können."], richtig:1, erklaerung:"Menschengerechte Arbeit darf nicht schädigen oder beeinträchtigen. Sie muss zudem ausführbar, erträglich, zumutbar und persönlichkeitsfördernd sein. Schadensfreiheit allein reicht daher nicht aus. (S. 6, 18)"},

{wb:"1.01", frage:"Ein Unternehmen plant eine neue Produktionsanlage. Wann sollte der Arbeitsschutz nach dem präventiven Grundanliegen eingebunden werden?", antworten:["Nach der Inbetriebnahme, sobald tatsächliche Gefährdungen durch Messungen bestätigt wurden.","Erst bei der Beschaffung persönlicher Schutzausrüstung, weil vorher noch keine konkreten Gefährdungen vorliegen.","Bereits während der Planung und Konzeption, damit Gefährdungen vorausschauend vermieden und gesundheitsfördernde Bedingungen geschaffen werden können."], richtig:2, erklaerung:"Prävention bedeutet, Arbeitsschutz frühzeitig in Planungs- und Konzeptionsprozesse einzubeziehen. Dadurch lassen sich Unfall- und Erkrankungsrisiken von vornherein minimieren. (S. 11–12)"},

{wb:"1.01", frage:"Nach einem Arbeitsunfall wird ein zuvor unbekanntes Sicherheitsdefizit festgestellt und die bestehende Anlage nachgerüstet. Welches Vorgehen liegt vor?", antworten:["Korrektives Vorgehen, weil ein erkanntes Defizit nachträglich durch Anpassung bestehender Arbeitsbedingungen behoben wird.","Präventives Vorgehen, weil jede technische Nachrüstung unabhängig vom Anlass vorausschauend wirkt.","Ausschließlich Rehabilitation, weil der Anlass ein bereits eingetretener Gesundheitsschaden ist."], richtig:0, erklaerung:"Korrektives Vorgehen reagiert auf bereits erkannte Mängel, beispielsweise nach Unfällen, Erkrankungen oder Beschwerden. Die nachträgliche Beseitigung eines Defizits ist korrektiv, auch wenn sie weitere Schäden verhindern soll. (S. 11–12)"},

{wb:"1.01", frage:"Warum sind korrektive Arbeitsschutzmaßnahmen gegenüber frühzeitiger präventiver Gestaltung häufig nachteilig?", antworten:["Weil korrektive Maßnahmen grundsätzlich keine Gefährdungen reduzieren können und deshalb nur der Dokumentation dienen.","Weil nachträgliche Änderungen häufig weniger Gestaltungsspielraum bieten, Gefährdungen teilweise nur unzureichend abbauen und hohen Aufwand verursachen.","Weil korrektive Maßnahmen nur zulässig sind, wenn präventive Maßnahmen rechtlich ausgeschlossen wurden."], richtig:1, erklaerung:"Bei bereits realisierten Arbeitsbedingungen ist der Gestaltungsspielraum meist kleiner. Korrektive Maßnahmen können deshalb weniger wirksam und zugleich aufwendiger sowie kostenintensiver sein. (S. 12)"},

{wb:"1.01", frage:"Ein Betrieb hat seine Arbeitsplätze einmalig beurteilt und erklärt den Arbeitsschutz damit für abgeschlossen. Welche Bewertung entspricht dem Wissensbaustein?", antworten:["Das ist ausreichend, solange keine meldepflichtigen Arbeitsunfälle eintreten.","Das ist bei unveränderten Arbeitsmitteln ausreichend, weil nur technische Neuerungen eine erneute Betrachtung erfordern.","Das widerspricht dem kontinuierlichen Verbesserungsprozess, da Arbeitsbedingungen, Erkenntnisse und Anforderungen fortlaufend überprüft und angepasst werden müssen."], richtig:2, erklaerung:"Arbeitsschutz ist eine ständige Aufgabe. Unternehmen müssen Defizite und Verbesserungsmöglichkeiten fortlaufend erkennen, aktuelle Erkenntnisse berücksichtigen und Maßnahmen planen, umsetzen und überprüfen. (S. 11–13)"},

{wb:"1.01", frage:"Ein kleines Unternehmen argumentiert, systematischer Arbeitsschutz sei nur für größere Produktionsbetriebe erforderlich. Welche Aussage trifft zu?", antworten:["Systematisch betriebener Arbeitsschutz ist unabhängig von Rechtsform, Unternehmensgröße und Tätigkeit erforderlich.","Kleine Unternehmen müssen Arbeitsschutz nur bei besonders gefährlichen Tätigkeiten systematisch organisieren.","Die Verpflichtung zu systematischem Arbeitsschutz hängt davon ab, ob ein Unternehmen eigene Fachkräfte für Arbeitssicherheit beschäftigt."], richtig:0, erklaerung:"Der Wissensbaustein betont, dass Planung, Umsetzung und Überprüfung von Arbeitsschutzmaßnahmen jedes Unternehmen betreffen, unabhängig von Rechtsform, Größe und Tätigkeit. (S. 12–13)"},

{wb:"1.01", frage:"Eine Führungskraft möchte bei der Beurteilung nur die durchschnittlichen Fähigkeiten der Belegschaft berücksichtigen. Was spricht aus Sicht des Arbeitsschutzes dagegen?", antworten:["Individuelle Leistungsvoraussetzungen dürfen grundsätzlich nicht berücksichtigt werden, weil alle Beschäftigten identische Anforderungen erfüllen müssen.","Beschäftigte besitzen unterschiedliche und veränderliche Leistungsvoraussetzungen; Arbeitsbedingungen sollen für möglichst alle für die Tätigkeit infrage kommenden Personen geeignet sein.","Arbeitsschutz muss sich ausschließlich am leistungsfähigsten Beschäftigten orientieren, damit die betriebliche Produktivität erhalten bleibt."], richtig:1, erklaerung:"Die Gestaltung soll unterschiedliche physische und psychische Voraussetzungen berücksichtigen. Diese können sich beispielsweise durch langfristige oder situative Faktoren verändern. (S. 3, 18)"},

{wb:"1.01", frage:"Ein Betrieb beschäftigt Arbeitnehmer, Auszubildende, Beamte und Personen in anerkannten Werkstätten für behinderte Menschen. Für welche Gruppen ist Arbeitsschutz nach der Darstellung des Dokuments zu betreiben?", antworten:["Nur für Arbeitnehmer und Auszubildende, da die übrigen Gruppen besonderen Rechtsbereichen unterliegen.","Für Arbeitnehmer und Beamte, während Auszubildende und Werkstattbeschäftigte ausschließlich über besondere Einrichtungen geschützt werden.","Für sämtliche genannten Gruppen; das Dokument nennt darüber hinaus weitere arbeitnehmerähnliche Personen."], richtig:2, erklaerung:"Die Darstellung auf Seite 14 nennt Arbeitnehmerinnen und Arbeitnehmer, Beamtinnen und Beamte, Auszubildende, Lehrkräfte, Beschäftigte in Werkstätten für behinderte Menschen sowie weitere arbeitnehmerähnliche Personen. Arbeitsschutz richtet sich an alle Beschäftigten. (S. 14)"},

{wb:"1.01", frage:"Bei einer Arbeitsplatzgestaltung werden die besonderen Anforderungen älterer Beschäftigter und von Menschen mit Behinderungen nicht berücksichtigt. Welcher Grundsatz wird verletzt?", antworten:["Sichere und gesundheitsgerechte Arbeitsbedingungen müssen für alle Beschäftigten gewährleistet werden, wobei besondere Anforderungen einzelner Gruppen zu berücksichtigen sind.","Besondere Anforderungen sind ausschließlich bei Jugendlichen relevant; für andere Gruppen gelten grundsätzlich einheitliche Leistungsvoraussetzungen.","Die Berücksichtigung unterschiedlicher Beschäftigtengruppen ist ausschließlich eine freiwillige Maßnahme der betrieblichen Gesundheitsförderung."], richtig:0, erklaerung:"Das Dokument fordert Arbeitsschutz für alle Beschäftigten und weist ausdrücklich auf besondere Anforderungen unter anderem von Frauen, Jugendlichen, älteren Beschäftigten und Menschen mit Behinderungen hin. (S. 14)"},

{wb:"1.01", frage:"Eine Unternehmensleitung betrachtet Arbeitsschutz ausschließlich als Kostenfaktor. Welche wirtschaftlichen Wirkungen bleiben dabei unberücksichtigt?", antworten:["Arbeitsschutz wirkt ausschließlich auf die öffentliche Wahrnehmung, während Produktivität und Fehlzeiten davon unabhängig sind.","Gut gestaltete Arbeitsbedingungen können Fehlzeiten, Störungen und Reibungsverluste verringern sowie Leistungsfähigkeit, Motivation, Produktivität und Unternehmensattraktivität stärken.","Arbeitsschutzmaßnahmen erhöhen die Produktivität nur dann, wenn sie unmittelbar die Arbeitsgeschwindigkeit steigern."], richtig:1, erklaerung:"Das Dokument beschreibt sowohl vermiedene Unfall-, Krankheits- und Ausfallkosten als auch positive Wirkungen auf Motivation, Leistungsfähigkeit, Produktivität und Attraktivität des Unternehmens. Es verweist zudem auf Studien mit einem Folgeertrag von mehr als zwei Euro je investiertem Euro. (S. 15–16)"},

{wb:"1.01", frage:"Ein Betrieb verbessert den Umgang mit Gefahrstoffen und Produktionsabfällen. Welche zusätzliche Bedeutung hat dies neben dem unmittelbaren Gesundheitsschutz?", antworten:["Die Maßnahme dient ausschließlich dem betrieblichen Gesundheitsschutz, weil Umweltwirkungen nicht zum Begründungszusammenhang des Arbeitsschutzes gehören.","Umweltschutz wird nur dann erreicht, wenn zuvor ein arbeitsbedingter Gesundheitsschaden eingetreten ist.","Die Maßnahme kann zugleich Umweltgefahren verringern, weil Arbeitsschutz und Umweltschutz in vielen Bereichen übereinstimmende Ziele verfolgen."], richtig:2, erklaerung:"Der verantwortungsvolle Umgang mit Gefahrstoffen und Produktionsabfällen schützt Beschäftigte und Ökosysteme. Das Dokument betont deshalb die wechselseitigen Zusammenhänge zwischen Arbeits- und Umweltschutz. (S. 16)"},

{wb:"1.02", frage:"Welche drei Stufen der Technikentwicklung beeinflussten laut Wissensbaustein die Arbeitsbedingungen und den Arbeitsschutz besonders stark?", antworten:["Mechanisierung, Elektrifizierung und europäische Harmonisierung","Mechanisierung, Etablierung des Fabriksystems und Einführung der Computertechnik","Fabrikinspektion, gesetzliche Unfallversicherung und Digitalisierung"], richtig:1, erklaerung:"Das Dokument unterscheidet Mechanisierung mit neuen technischen Gefährdungen, das Fabriksystem mit Arbeitsteilung und Monotonie sowie die Computertechnik mit Informationsverdichtung und zunehmender Undurchschaubarkeit von Maschinen. (S. 3)"},

{wb:"1.02", frage:"Welche Bedeutung hatte das Preußische Regulativ von 1839?", antworten:["Es verbot Fabrikarbeit für Kinder unter neun Jahren und begrenzte die tägliche Arbeitszeit Jugendlicher bis 16 Jahre auf zehn Stunden.","Es führte die staatliche Fabrikinspektion ein und verpflichtete Unternehmen zur Bestellung von Sicherheitsingenieuren.","Es begründete die gesetzliche Unfallversicherung und übertrug den Berufsgenossenschaften die Aufsicht über Fabriken."], richtig:0, erklaerung:"Das Preußische Regulativ enthielt frühe Schutzbestimmungen für Kinder und Jugendliche in Fabriken, Bergwerken und Hüttenbetrieben. Eine Institution zur Kontrolle dieser Bestimmungen wurde 1839 noch nicht geschaffen. (S. 6)"},

{wb:"1.02", frage:"Welches Ereignis begründete 1884 einen entscheidenden Schritt zur Institutionalisierung des Arbeitsschutzes?", antworten:["Die Einführung der staatlichen Gewerbeaufsicht mit Zuständigkeit für sämtliche gewerblichen Anlagen.","Die gesetzliche Verpflichtung zur Bestellung von Betriebsärzten und Fachkräften für Arbeitssicherheit.","Das Unfallversicherungsgesetz mit der gesetzlichen Unfallversicherung und der Gründung von Berufsgenossenschaften."], richtig:2, erklaerung:"Das Unfallversicherungsgesetz von 1884 schuf eine finanzielle Absicherung bei arbeitsbedingten Gesundheitsschäden. Die Berufsgenossenschaften übernahmen Versicherungsaufgaben und erhielten Befugnisse zur Unfallverhütung. (S. 9–10)"},

{wb:"1.02", frage:"Welche beiden Institutionen bilden nach dem Wissensbaustein das duale Arbeitsschutzsystem?", antworten:["Betriebsärztlicher Dienst und Fachkräfte für Arbeitssicherheit","Staatliche Gewerbeaufsicht beziehungsweise Arbeitsschutzverwaltung und gesetzliche Unfallversicherungsträger","Arbeitgeberverbände und betriebliche Sicherheitsbeauftragte"], richtig:1, erklaerung:"Das duale Arbeitsschutzsystem beruht auf dem Zusammenwirken staatlicher Arbeitsschutzverwaltung und gesetzlicher Unfallversicherungsträger. Beide wirken im überbetrieblichen Arbeitsschutz durch Vorschriften, Beratung und Überwachung. (S. 10, 17)"},

{wb:"1.02", frage:"Welche wesentliche Veränderung brachte das Arbeitssicherheitsgesetz von 1973?", antworten:["Es schuf die gesetzliche Grundlage für die Bestellung von Betriebsärzten und Fachkräften für Arbeitssicherheit zur Unterstützung der Arbeitgeber.","Es begründete erstmals die staatliche Fabrikinspektion und führte verbindliche Mindeststandards für Maschinen ein.","Es führte die gesetzliche Unfallversicherung ein und übertrug den Berufsgenossenschaften die Entschädigung von Arbeitsunfällen."], richtig:0, erklaerung:"Das Arbeitssicherheitsgesetz bildet seit 1973 die Grundlage für die Tätigkeit professionell ausgebildeter Betriebsärztinnen und Betriebsärzte sowie Fachkräfte für Arbeitssicherheit. Sie unterstützen die Arbeitgeber im betrieblichen Arbeitsschutz. (S. 12)"},

{wb:"1.02", frage:"Welche grundlegende Entwicklung zeigt die Abbildung zum Wandel des Arbeitsschutzverständnisses?", antworten:["Vom präventiven über das korrektive zum personenbezogenen Unfallverständnis.","Vom staatlichen Arbeitsschutz über die Unfallversicherung zur ausschließlich betrieblichen Eigenverantwortung.","Vom personenbezogenen Unfallverständnis über den korrektiven Ansatz zum präventionsbezogenen Verständnis."], richtig:2, erklaerung:"Die Abbildung zeigt drei Entwicklungsstufen: Zunächst wird der Mensch für Unfälle verantwortlich gemacht, danach werden technische und organisatorische Maßnahmen als Reaktion auf Unfälle ergriffen. Im modernen Verständnis steht die vorausschauende Gestaltung der Arbeitsbedingungen im Vordergrund. (S. 12)"},

{wb:"1.02", frage:"Warum führte die Mechanisierung im 19. Jahrhundert zu einer deutlichen Verschärfung der Gefährdungssituation?", antworten:["Weil die maschinelle Produktion bereits umfassend geregelt war, die Beschäftigten aber neue Vorschriften nicht kannten.","Weil kraftbetriebene Maschinen, schwere Gegenstände, gefährliche Stoffe, Lärm und fehlende Schutzvorrichtungen auf lange Arbeitszeiten trafen.","Weil vor allem die zunehmende Informationsverarbeitung und die Automatisierung psychische Belastungen auslösten."], richtig:1, erklaerung:"In der frühen Industrialisierung entstanden neue Gefährdungspotenziale durch leistungsfähige Maschinen ohne ausreichende Schutzvorrichtungen sowie durch belastende Umgebungsbedingungen. Fehlende Arbeitszeitregelungen verstärkten die Unfall- und Erkrankungsrisiken. (S. 5–6)"},

{wb:"1.02", frage:"Welche zusätzliche Problematik entstand mit der Etablierung des Fabriksystems gegenüber der reinen Mechanisierung?", antworten:["Arbeitsteilung und Fließbandarbeit steigerten die Leistung, konnten aber Monotonie, Sinnentleerung und Zeitdruck verursachen.","Die Unfallversicherung ersetzte die betriebliche Gefährdungsvermeidung durch finanzielle Entschädigung.","Die Verarbeitung großer Informationsmengen führte erstmals zur Undurchschaubarkeit automatisierter Maschinen."], richtig:0, erklaerung:"Die Etablierung des Fabriksystems veränderte nicht nur die eingesetzte Technik, sondern auch die Arbeitsorganisation. Arbeitsteilung und Fließbandarbeit beschleunigten Prozesse und brachten neue Belastungen wie Monotonie und Zeitdruck hervor. (S. 3)"},

{wb:"1.02", frage:"Worin bestand das personenbezogene Ursachenverständnis von Arbeitsunfällen während der frühen Industrialisierung?", antworten:["Unfälle wurden als Folge unzureichender technischer und organisatorischer Gestaltung betrachtet.","Unfälle wurden grundsätzlich als versicherbare Ereignisse ohne betriebliche Ursachenbewertung behandelt.","Unfälle galten als unvermeidlicher Preis des technischen Fortschritts, wobei das Verschulden überwiegend den Betroffenen zugeschrieben wurde."], richtig:2, erklaerung:"Nach der damals vorherrschenden Auffassung waren Unfälle ein unvermeidbarer Nebeneffekt der maschinellen Produktion. Die Verantwortung wurde den verletzten Personen zugeschrieben; betriebliche Unfallursachen wurden kaum untersucht. (S. 4, 6)"},

{wb:"1.02", frage:"Warum war die Arbeiterschaft im 19. Jahrhundert laut Dokument in zweifacher Hinsicht schutzlos?", antworten:["Weil sie zwar Unfallentschädigung erhielt, aber weder medizinische Versorgung noch eine staatliche Aufsicht bestand.","Weil sie gefährlichen Arbeitsbedingungen ausgesetzt war und bei Krankheit oder Unfall häufig zugleich ihre wirtschaftliche Existenzgrundlage verlor.","Weil ausschließlich die Beschäftigung von Kindern geregelt war und erwachsene Beschäftigte keinen Zugang zu Fabrikarbeit hatten."], richtig:1, erklaerung:"Die Beschäftigten waren einerseits hohen Gefährdungen, Belastungen und langen Arbeitszeiten ausgesetzt. Andererseits fehlte eine finanzielle Absicherung bei Unfall, Krankheit und Arbeitsunfähigkeit, sodass häufig auch die Familien in Armut gerieten. (S. 8)"},

{wb:"1.02", frage:"Weshalb führte das Preußische Regulativ von 1839 zunächst nur zu begrenzten Verbesserungen?", antworten:["Es enthielt zwar Schutzbestimmungen, schuf aber noch keine Institution zu deren Überwachung.","Es beschränkte sich auf die Entschädigung bereits eingetretener Arbeitsunfälle.","Es übertrug die Kontrolle ausschließlich den Berufsgenossenschaften, die keine Durchsetzungsbefugnisse hatten."], richtig:0, erklaerung:"Das Regulativ war ein früher gesetzlicher Schritt zum Schutz von Kindern und Jugendlichen. Ohne eine eigens geschaffene Kontrollinstitution blieb seine praktische Durchsetzung jedoch begrenzt. (S. 6)"},

{wb:"1.02", frage:"Welche Aussage beschreibt die Bedeutung der Lokalkommissionen ab 1847 am treffendsten?", antworten:["Sie waren staatliche Kontrollbehörden mit umfassenden gesetzlichen Durchsetzungsbefugnissen.","Sie ersetzten die Fabrikinspektion und überwachten die gesetzliche Unfallversicherung.","Sie waren freiwillige kommunale Aufsichtsorgane ohne Durchsetzungsbefugnisse und markierten einen frühen Schritt zur Institutionalisierung."], richtig:2, erklaerung:"Die Lokalkommissionen berieten und überwachten ehrenamtlich die Umsetzung des Preußischen Regulativs. Obwohl ihnen Durchsetzungsbefugnisse fehlten, bildeten sie einen Anfang der organisatorischen Verankerung des Arbeitsschutzes. (S. 7)"},

{wb:"1.02", frage:"Was unterschied die staatliche Fabrikinspektion von 1853/54 wesentlich von den früheren Lokalkommissionen?", antworten:["Sie konzentrierte sich ausschließlich auf die finanzielle Entschädigung nach Arbeitsunfällen.","Sie war eine gesetzlich geschaffene staatliche Kontrollinstitution, deren erste Inspektoren 1854 ihre Arbeit aufnahmen.","Sie bestand aus ehrenamtlichen Gemeindevertretern und verfügte weiterhin über keinerlei staatlichen Auftrag."], richtig:1, erklaerung:"Die staatliche Fabrikinspektion wurde 1853 als erstes staatliches Kontrollorgan geschaffen. Ab 1854 nahmen Fabrikinspektoren ihre Tätigkeit auf. Ihre Wirksamkeit blieb zunächst wegen geringer personeller Ausstattung und fehlender Mindeststandards eingeschränkt. (S. 9)"},

{wb:"1.02", frage:"Warum war die Untersuchung der Gesundheits- und Unfallgefahren von 1874/75 für das Arbeitsschutzverständnis bedeutsam?", antworten:["Sie zeigte einen Zusammenhang zwischen Arbeitsbedingungen und Unfällen beziehungsweise Erkrankungen und stellte damit die alleinige Schuldzuweisung an Beschäftigte infrage.","Sie belegte, dass Unfälle überwiegend auf individuelles Fehlverhalten zurückgingen und technische Schutzmaßnahmen wenig wirksam waren.","Sie führte unmittelbar zur flächendeckenden Einführung verbindlicher Schutzstandards und einer umfassenden staatlichen Kontrolle."], richtig:0, erklaerung:"Die Untersuchung stellte einen klaren Zusammenhang zwischen betrieblichen Bedingungen, giftigen Stoffen, fehlenden Maschinenschutzvorrichtungen und Gesundheitsschäden fest. Damit verlor das rein personenbezogene Unfallverständnis an Glaubwürdigkeit. Unmittelbare weitreichende Konsequenzen blieben jedoch aus. (S. 9)"},

{wb:"1.02", frage:"Welche Veränderung bewirkte der Aufsichtsparagraph von 1878?", antworten:["Er übertrug die Unfallversicherung auf branchenweise organisierte Berufsgenossenschaften.","Er ersetzte die staatliche Fabrikinspektion vollständig durch betriebliche Sicherheitsingenieure.","Er machte die Fabrikinspektion obligatorisch, stärkte den gesetzlichen Auftrag der Aufsichtsbeamten und ermöglichte zusätzliche Schutzvorschriften."], richtig:2, erklaerung:"Ab 1878 war die Fabrikinspektion verpflichtend. Die Aufsichtsbeamten wurden ausdrücklich für den Schutz von Leben und Gesundheit zuständig; zudem konnten staatliche Stellen Schutzvorschriften erlassen. Die praktischen Auswirkungen blieben zunächst begrenzt. (S. 9)"},

{wb:"1.02", frage:"Welche Kombination beschreibt die Aufgaben der gesetzlichen Unfallversicherung ab 1884 entsprechend der Abbildung?", antworten:["Staatliche Fabrikinspektion, Festlegung allgemeiner Arbeitszeiten und Bestellung von Betriebsärzten.","Unfallverhütung, Rehabilitation durch Übernahme von Heilbehandlungskosten und Entschädigung durch Rentenleistungen.","Ausschließlich Entschädigung von Berufskrankheiten, Kontrolle der Arbeitsorganisation und Förderung der Vereinbarkeit von Beruf und Familie."], richtig:1, erklaerung:"Die Abbildung zum System der gesetzlichen Unfallversicherung nennt Unfallverhütung durch Vorschriften und deren Überwachung, Rehabilitation durch Übernahme von Heilbehandlungskosten sowie Entschädigung in Form von Unfall- und Hinterbliebenenrenten. (S. 10)"},

{wb:"1.02", frage:"Weshalb gilt das Jahr 1891 als Gründungsjahr des dualen Arbeitsschutzsystems?", antworten:["Weil mit der staatlichen Gewerbeaufsicht neben den Berufsgenossenschaften eine zweite tragende Institution des überbetrieblichen Arbeitsschutzes etabliert wurde.","Weil erstmals Betriebsärzte und Sicherheitsingenieure gemeinsam die gesamte staatliche Arbeitsschutzaufsicht übernahmen.","Weil die gesetzliche Unfallversicherung ihre Überwachungsbefugnisse vollständig an die staatliche Fabrikinspektion abgab."], richtig:0, erklaerung:"Das Arbeiterschutzgesetz von 1891 führte zur staatlichen Gewerbeaufsicht mit erweiterten Befugnissen und Zuständigkeit für alle gewerblichen Anlagen. Gemeinsam mit den Berufsgenossenschaften bildete sie die beiden Säulen des dualen Systems. (S. 10)"},

{wb:"1.02", frage:"Wie lässt sich die im Dokument beschriebene Halbierung schwerwiegender Unfallzahlen zwischen 1886 und 1913 erklären?", antworten:["Durch die vollständige Automatisierung besonders gefährlicher Produktionsbereiche.","Durch den Übergang von der Industrie- zur Dienstleistungsgesellschaft bereits vor dem Ersten Weltkrieg.","Durch weitreichendere Schutzbestimmungen und deren zunehmend wirksame institutionelle Durchsetzung."], richtig:2, erklaerung:"Laut Dokument halbierten sich zwischen 1886 und 1913 die jährlichen tödlichen Arbeitsunfälle und die Unfälle mit dauerhafter Erwerbsunfähigkeit. Als wesentlichen Grund nennt es den Aufholprozess durch verbindlichere Bestimmungen und deren praktische Durchsetzung. (S. 10)"},

{wb:"1.02", frage:"Ein Unternehmen führt 1920 aus eigener Initiative Sicherheitsingenieure ein. Wie ist diese Maßnahme historisch einzuordnen?", antworten:["Als Umsetzung einer seit 1884 bestehenden allgemeinen gesetzlichen Pflicht zur Bestellung von Fachkräften für Arbeitssicherheit.","Als freiwilliger Ausbau des betrieblichen Arbeitsschutzes und Vorläufer der später gesetzlich verankerten Tätigkeit von Fachkräften für Arbeitssicherheit.","Als Maßnahme der staatlichen Gewerbeaufsicht, die seit 1891 ausschließlich betriebsinterne Sicherheitsingenieure beschäftigte."], richtig:1, erklaerung:"Ab 1920 setzten einzelne Großbetriebe freiwillig Sicherheitsingenieure ein, besonders in der Chemie- und Stahlindustrie. Sie gelten als Vorläufer der Fachkräfte für Arbeitssicherheit, deren gesetzliche Grundlage erst 1973 geschaffen wurde. (S. 11–12)"},

{wb:"1.02", frage:"Ein Betrieb möchte die historische Entwicklung der Sicherheitsbeauftragten darstellen. Welche Abfolge entspricht dem Dokument?", antworten:["1919 erste Unfallvertrauensmänner, 1963 gesetzliche Verankerung der Sicherheitsbeauftragten durch das Unfallversicherungsneuregelungsgesetz.","1920 Einführung der Sicherheitsbeauftragten durch das Arbeitssicherheitsgesetz, 1973 Umbenennung in Unfallvertrauensmänner.","1884 verpflichtende Bestellung von Sicherheitsbeauftragten durch die Berufsgenossenschaften, 1891 Übertragung an die Gewerbeaufsicht."], richtig:0, erklaerung:"Erste Unfallvertrauensmänner wurden ab 1919 freiwillig bestellt, um kollegial über Arbeitsschutz zu informieren. 1963 wurde ihre Funktion mit der Einführung von Sicherheitsbeauftragten gesetzlich verankert. (S. 11)"},

{wb:"1.02", frage:"Ein Historiker untersucht die Reformen des Unfallversicherungsrechts von 1925. Welche Zusammenstellung ist korrekt?", antworten:["Einführung der gesetzlichen Unfallversicherung, erstmalige Gründung der Berufsgenossenschaften und Schaffung der staatlichen Gewerbeaufsicht.","Einführung des Arbeitsschutzgesetzes, gesetzliche Bestellung von Betriebsärzten und Umsetzung der EU-Rahmenrichtlinie.","Einbeziehung von Berufskrankheiten und Wegeunfällen sowie Erweiterung des Präventionsauftrags der Berufsgenossenschaften."], richtig:2, erklaerung:"1925 wurden erstmals Berufskrankheiten als Versicherungsfälle anerkannt und Wegeunfälle einbezogen. Zugleich wurde der Präventionsauftrag erweitert: Unfallverhütung sollte sich an neuen medizinischen Erkenntnissen und technischen Möglichkeiten orientieren. (S. 11)"},

{wb:"1.02", frage:"Ein Betrieb untersucht nach mehreren Unfällen die Ursachen und verändert anschließend Maschinen und Arbeitsabläufe. Welchem historischen Arbeitsschutzverständnis entspricht dies vor allem?", antworten:["Dem personenbezogenen Verständnis, da Unfallursachen ausschließlich bei den Beschäftigten gesucht werden.","Dem korrektiven Verständnis, da technische und organisatorische Verbesserungen erst nach eingetretenen Ereignissen erfolgen.","Dem präventionsbezogenen Verständnis, da Gefährdungen bereits vor Entstehung der Arbeitsbedingungen vermieden werden."], richtig:1, erklaerung:"Der korrektive Ansatz leitet Schutzmaßnahmen aus der Untersuchung bereits eingetretener Unfälle, Erkrankungen oder Unfallschwerpunkte ab. Er verbessert die Arbeitsbedingungen nachträglich, während der präventive Ansatz vorausschauend gestaltet. (S. 11–12)"},

{wb:"1.02", frage:"Eine Unternehmensleitung behauptet, die europäische Rechtsetzung habe für den deutschen Arbeitsschutz keine wesentliche Bedeutung. Welche historische Entwicklung widerlegt dies?", antworten:["Die zunehmende europäische Einflussnahme seit 1985 und die Umsetzung der EU-Arbeitsschutzrahmenrichtlinie durch das Arbeitsschutzgesetz von 1996.","Die Gründung der Berufsgenossenschaften 1884 als unmittelbar europäische Institutionen.","Die Einführung der staatlichen Fabrikinspektion 1853 aufgrund einer europaweit verbindlichen Arbeitsschutzrichtlinie."], richtig:0, erklaerung:"Das Dokument beschreibt ab 1985 die zunehmende Verbindlichkeit europäischer Vorgaben. Das Arbeitsschutzgesetz von 1996 setzt die EU-Arbeitsschutzrahmenrichtlinie in deutsches Recht um. (S. 12–13)"},

{wb:"1.02", frage:"Ein Betrieb fragt, welche rechtliche Entwicklung 1996 den modernen Arbeitsschutz und die Unfallversicherung prägte. Welche Antwort ist richtig?", antworten:["Die erstmalige Einführung der staatlichen Gewerbeaufsicht und die Verpflichtung zur Bestellung von Unfallvertrauensmännern.","Die Gründung der Berufsgenossenschaften und die erstmalige Einbeziehung von Wegeunfällen.","Das Arbeitsschutzgesetz zur Umsetzung der EU-Rahmenrichtlinie und das SGB VII als Rechtsgrundlage der gesetzlichen Unfallversicherung."], richtig:2, erklaerung:"1996 wurde das Arbeitsschutzgesetz verabschiedet, das die Durchführung von Maßnahmen zur Verbesserung der Sicherheit und Gesundheit regelt und die europäische Rahmenrichtlinie umsetzt. Im selben Jahr wurde das SGB VII als neue Rechtsgrundlage der gesetzlichen Unfallversicherung beschlossen. (S. 13)"},

{wb:"1.02", frage:"Ein Unternehmen fordert für jede neue Technologie eine vollständig detaillierte gesetzliche Einzelanweisung. Welche Entwicklung des modernen Vorschriften- und Regelwerks spricht gegen diese Erwartung?", antworten:["Die Rückkehr zu ausschließlich personenbezogenen Unfallursachen und freiwilligen betrieblichen Regelungen.","Die stärkere Verwendung allgemeiner Schutzziele und des Stands der Technik, weil Gesetze nicht jede betriebliche Situation im Detail erfassen können.","Die vollständige Ablösung allgemeiner Schutzpflichten durch unveränderliche technische Grenzwerte."], richtig:1, erklaerung:"Das Dokument beschreibt eine Dynamisierung des Regelwerks. Allgemeine Schutzziele und der Bezug auf den Stand der Technik ermöglichen es, Schutzanforderungen mit der Entwicklung der Arbeitswelt zu verbinden, ohne sämtliche betrieblichen Einzelheiten gesetzlich vorzugeben. (S. 13)"},

{wb:"1.02", frage:"Eine Sifa soll den Begriff 'Stand der Technik' erläutern. Welche Beschreibung entspricht dem Glossar?", antworten:["Der Entwicklungsstand fortschrittlicher Verfahren, Einrichtungen oder Betriebsweisen, bei dem die praktische Eignung einer Maßnahme zum Schutz der Beschäftigten gesichert erscheint.","Der durchschnittliche technische Ausstattungsstand der meisten Betriebe einer Branche, unabhängig von der Schutzwirkung.","Der technische Zustand einer Anlage zum Zeitpunkt ihrer erstmaligen Inbetriebnahme, der für ihre gesamte Nutzungsdauer maßgeblich bleibt."], richtig:0, erklaerung:"Das Glossar beschreibt den Stand der Technik als Entwicklungsstand fortschrittlicher Verfahren, Einrichtungen oder Betriebsweisen, deren praktische Eignung zum Schutz der Beschäftigten als gesichert erscheint. Er ist damit kein unveränderlicher historischer Anlagenzustand. (S. 17)"},

{wb:"1.02", frage:"In einem Unternehmen treten neue psychische Belastungen auf, während klassische Gefährdungen durch Lärm und schwere Lasten weiterhin bestehen. Welcher Ansatz entspricht dem modernen Arbeitsschutz?", antworten:["Neue psychische Belastungen erst nach nachgewiesenen Erkrankungen untersuchen, während klassische Gefährdungen ausschließlich technisch betrachtet werden.","Klassische Gefährdungen als historisch erledigt betrachten und den Arbeitsschutz vollständig auf psychische Belastungen umstellen.","Sowohl klassische als auch neue Risikoschwerpunkte berücksichtigen und Gefährdungsvermeidung mit menschengerechter Gestaltung und Ressourcenförderung verbinden."], richtig:2, erklaerung:"Das Dokument beschreibt eine Verschiebung und Erweiterung der Risikoschwerpunkte. Neben klassischen Belastungen müssen neue Stoffe, psychische Belastungen und Mobilitätsanforderungen berücksichtigt werden. Zugleich gewinnt die Förderung gesundheitlicher Ressourcen an Bedeutung. (S. 13–14)"},

{wb:"1.02", frage:"Ein Unternehmen führt wechselnde Arbeitsorte, mobiles Arbeiten und flexible Arbeitszeiten ein. Welche im Dokument beschriebene Entwicklung ist hier besonders relevant?", antworten:["Die Mechanisierung der Industriearbeit mit überwiegend stationären Produktionsmaschinen.","Die Entgrenzung der Arbeit, bei der feste Grenzen zwischen Arbeits- und Privatleben sowie zwischen Arbeitsorten und Arbeitszeiten verschwimmen.","Die Institutionalisierung des Arbeitsschutzes durch die Einführung kommunaler Lokalkommissionen."], richtig:1, erklaerung:"Entgrenzung bezeichnet die zunehmende Auflösung fester zeitlicher und räumlicher Grenzen der Arbeit. Mobile Arbeitsformen, unterschiedliche Arbeitsorte und vielfältigere Arbeitszeitmodelle sind ausdrücklich genannte Beispiele. (S. 14–15)"},

{wb:"1.02", frage:"Ein Betrieb stellt Beschäftigte mit sehr unterschiedlichen körperlichen Voraussetzungen, Lebenssituationen und Hintergründen ein. Welche Herausforderung ergibt sich daraus nach dem Wissensbaustein?", antworten:["Die Arbeitsgestaltung muss Teilhabe, Inklusion und Diversität berücksichtigen und mit unterschiedlichen individuellen Leistungsvoraussetzungen umgehen.","Die Arbeitsbedingungen sollten auf eine einheitliche Durchschnittsperson ausgerichtet werden, damit Vielfalt keinen Einfluss auf den Arbeitsschutz hat.","Der Arbeitsschutz kann sich auf technische Risiken beschränken, weil individuelle Leistungsvoraussetzungen ausschließlich personalpolitisch relevant sind."], richtig:0, erklaerung:"Der Umgang mit Vielfalt wird im Dokument als zentrale gesellschaftliche Entwicklung beschrieben. Teilhabe, Inklusion, Diversität und die Vermeidung von Diskriminierung verlangen eine Arbeitsgestaltung, die unterschiedliche Leistungsvoraussetzungen berücksichtigt. (S. 14–15)"},

{wb:"1.02", frage:"Ein Unternehmen möchte seine Arbeitsschutzstrategie auf die kommenden Jahre ausrichten. Welche Kombination berücksichtigt die im Dokument dargestellten gesellschaftlichen Entwicklungen am umfassendsten?", antworten:["Ausschließliche Konzentration auf Maschinenunfälle, weil demografische Veränderungen und gesellschaftliche Werte außerhalb des Arbeitsschutzes liegen.","Festlegung unveränderlicher Schutzmaßnahmen, weil Digitalisierung und kürzere Innovationszyklen vor allem die Produktentwicklung betreffen.","Berücksichtigung von demografischem Wandel, Wertewandel, Digitalisierung, Vielfalt, Entgrenzung und verändertem Risikobewusstsein."], richtig:2, erklaerung:"Das Dokument nennt sechs wesentliche gesellschaftliche Entwicklungen: demografische Entwicklung, Wertewandel, Digitalisierung, Umgang mit Vielfalt, Entgrenzung von Lebensbereichen und veränderte Risikoakzeptanz. Die Abbildung fasst diese Entwicklungen und ihre Auswirkungen zusammen. (S. 14–15)"},

{wb:"1.02", frage:"Ein Arbeitgeber möchte Arbeitsschutz nur dann anpassen, wenn nach einer organisatorischen Veränderung Unfälle oder Beschwerden auftreten. Welche Vorgehensweise entspricht stattdessen dem modernen Präventionsgedanken?", antworten:["Bestehende Maßnahmen unverändert beibehalten, solange die bisherigen Unfallzahlen niedrig bleiben.","Arbeitsschutz als ständige Aufgabe verstehen, Veränderungen frühzeitig begleiten und sowohl Gefährdungen vermeiden als auch gesundheitliche Ressourcen fördern.","Zunächst die individuelle Anpassungsfähigkeit der Beschäftigten erhöhen und erst bei nachgewiesenen Schäden die Arbeitsbedingungen verändern."], richtig:1, erklaerung:"Das moderne Arbeitsschutzverständnis verlangt vorausschauendes Handeln bei Veränderungen. Schutz und Förderung der Gesundheit sind gleichrangig. Arbeit wird dabei nicht nur als Quelle von Anforderungen, sondern auch als mögliche Ressource für Gesundheit und Arbeitsfähigkeit betrachtet. (S. 13–16)"},
{wb:"1.03",frage:"Welche beiden Zielrichtungen verfolgt die EU im Arbeitsschutz auf Grundlage der Artikel 114 und 153 AEUV?",antworten:["Die Harmonisierung von Produktanforderungen und die Festlegung von Mindeststandards für Arbeitsbedingungen","Die Vereinheitlichung sämtlicher nationaler Arbeitsverträge und die Abschaffung betrieblicher Regelungen","Die ausschließliche Regelung der Produktsicherheit und die Übertragung des betrieblichen Arbeitsschutzes auf Unternehmen"],richtig:0,erklaerung:"Artikel 114 AEUV bildet die Grundlage für die Angleichung von Produktvorschriften zur Verwirklichung des Binnenmarktes. Artikel 153 AEUV ermöglicht Mindestvorschriften zur Verbesserung der Arbeitsbedingungen und des Gesundheitsschutzes. Beide Zielrichtungen verbinden wirtschaftliche und soziale Interessen. (S. 4–5)"},

{wb:"1.03",frage:"Wodurch unterscheiden sich EU-Richtlinien und EU-Verordnungen hinsichtlich ihrer rechtlichen Wirkung?",antworten:["EU-Richtlinien gelten ausschließlich für Unternehmen, während EU-Verordnungen nur staatliche Behörden verpflichten","EU-Richtlinien müssen in nationales Recht umgesetzt werden, während EU-Verordnungen unmittelbar in den Mitgliedstaaten gelten","EU-Richtlinien sind unverbindliche Empfehlungen, während EU-Verordnungen erst nach Zustimmung der nationalen Parlamente gelten"],richtig:1,erklaerung:"EU-Richtlinien verpflichten die Mitgliedstaaten zur Umsetzung ihrer Vorgaben in nationales Recht. EU-Verordnungen gelten dagegen unmittelbar in allen Mitgliedstaaten. Diese Unterscheidung ist für das Verständnis der europäischen und deutschen Arbeitsschutzgesetzgebung grundlegend. (S. 6)"},

{wb:"1.03",frage:"Welche Aussage beschreibt die unterschiedlichen nationalen Gestaltungsspielräume bei europäischen Produkt- und Betriebsvorschriften korrekt?",antworten:["Bei beiden Vorschriftenarten dürfen Mitgliedstaaten jederzeit strengere Anforderungen festlegen","Produktvorschriften legen Mindeststandards fest, während Betriebsvorschriften vollständig harmonisiert sind","Harmonisierte Produktvorschriften dürfen national weder unter- noch überschritten werden; bei Betriebsvorschriften sind höhere Standards möglich"],richtig:2,erklaerung:"Harmonisierte Produktvorschriften sollen gleiche Anforderungen im europäischen Binnenmarkt gewährleisten. Betriebsvorschriften enthalten dagegen Mindestanforderungen an Arbeitsbedingungen, die national nicht unterschritten, aber überschritten werden dürfen. (S. 5–6)"},

{wb:"1.03",frage:"Welche Rechtsgrundlage ermächtigt die gesetzlichen Unfallversicherungsträger zum Erlass verbindlicher Unfallverhütungsvorschriften?",antworten:["Das Siebte Buch Sozialgesetzbuch (SGB VII)","Das Neunte Buch Sozialgesetzbuch (SGB IX)","Das Arbeitssicherheitsgesetz (ASiG)"],richtig:0,erklaerung:"Das SGB VII bildet die Grundlage der gesetzlichen Unfallversicherung. Es enthält den Präventionsauftrag der Unfallversicherungsträger und ermächtigt sie, für ihre Mitgliedsbetriebe rechtsverbindliche Unfallverhütungsvorschriften zu erlassen. Das SGB IX behandelt dagegen insbesondere die Teilhabe von Menschen mit Behinderungen. (S. 24)"},

{wb:"1.03",frage:"Welche Funktion erfüllt das Arbeitssicherheitsgesetz (ASiG) im betrieblichen Arbeitsschutz?",antworten:["Es bestimmt unmittelbar sämtliche technischen Anforderungen an Maschinen und Arbeitsmittel","Es regelt insbesondere die Bestellung, Aufgaben und Zusammenarbeit von Betriebsärzten und Fachkräften für Arbeitssicherheit","Es legt ausschließlich die Höchstarbeitszeiten und Ruhezeiten der Beschäftigten fest"],richtig:1,erklaerung:"Das ASiG verpflichtet Arbeitgeber zur Bestellung von Betriebsärzten und Fachkräften für Arbeitssicherheit und regelt deren Aufgaben, grundlegende Anforderungen und Zusammenarbeit. Die konkrete betriebsärztliche und sicherheitstechnische Betreuung wird durch die DGUV Vorschrift 2 näher geregelt. (S. 20–21)"},

{wb:"1.03",frage:"Welche Aussage beschreibt den Stand von Wissenschaft und Technik nach dem Wissensbaustein?",antworten:["Er bezeichnet ausschließlich Verfahren, die von der überwiegenden Mehrheit der Fachleute bereits praktisch angewendet werden","Er bezeichnet den aktuellen Entwicklungsstand, dessen praktische Eignung gesichert erscheint, ohne dass ein Fachkonsens erforderlich ist","Er bezeichnet das höchste Anforderungsniveau auf Grundlage fortschrittlichster, durch Forschung und Experimente erprobter Erkenntnisse"],richtig:2,erklaerung:"Der Stand von Wissenschaft und Technik stellt das höchste der beschriebenen technischen Anforderungsniveaus dar. Die Erkenntnisse müssen durch Forschung und Experimente erprobt sein, aber noch nicht praktisch umgesetzt worden sein. Der Stand der Technik setzt dagegen eine gesichert erscheinende praktische Eignung voraus. (S. 13)"},

{wb:"1.03",frage:"Welche Aufgabe hat die Europäische Chemikalienagentur (ECHA) im Rahmen der REACH-Verordnung?",antworten:["Sie nimmt Stoffregistrierungen entgegen und bewertet deren Übereinstimmung mit den REACH-Bestimmungen","Sie legt für einzelne Betriebe die Arbeitszeiten beim Umgang mit Gefahrstoffen fest","Sie genehmigt nationale Unfallverhütungsvorschriften für Tätigkeiten mit chemischen Stoffen"],richtig:0,erklaerung:"REACH regelt unter anderem Registrierung, Bewertung, Zulassung und Beschränkung chemischer Stoffe. Die ECHA nimmt Registrierungen entgegen und prüft deren Konformität mit den REACH-Bestimmungen. Die Verordnung gilt unmittelbar in den EU-Mitgliedstaaten. (S. 8)"},

{wb:"1.03",frage:"Welche Reihenfolge entspricht dem hierarchischen Aufbau des DGUV-Vorschriften- und Regelwerks?",antworten:["DGUV Informationen, DGUV Grundsätze, DGUV Regeln, DGUV Vorschriften","DGUV Vorschriften, DGUV Regeln, DGUV Informationen, DGUV Grundsätze","DGUV Regeln, DGUV Vorschriften, DGUV Grundsätze, DGUV Informationen"],richtig:1,erklaerung:"An oberster Stelle stehen die rechtsverbindlichen DGUV Vorschriften. Darunter folgen DGUV Regeln mit konkretisierendem und empfehlendem Charakter sowie DGUV Informationen und DGUV Grundsätze. Die einzelnen Dokumentarten unterscheiden sich hinsichtlich Funktion und Verbindlichkeit. (S. 24–25)"},

{wb:"1.03",frage:"Warum können EU-Mitgliedstaaten bei Betriebsvorschriften strengere nationale Schutzanforderungen festlegen, bei harmonisierten Produktvorschriften jedoch nicht?",antworten:["Weil Betriebsvorschriften ausschließlich Empfehlungen enthalten, Produktvorschriften dagegen nationale Gesetze ersetzen","Weil die Mitgliedstaaten bei betrieblichen Anforderungen keine europäischen Vorgaben berücksichtigen müssen","Weil Betriebsvorschriften Mindeststandards zur Verbesserung der Arbeitsbedingungen festlegen, während harmonisierte Produktvorschriften einheitliche Marktanforderungen gewährleisten sollen"],richtig:2,erklaerung:"Die EU verfolgt mit Produktvorschriften den Abbau von Handelshemmnissen durch einheitliche Anforderungen. Betriebsvorschriften sollen dagegen ein gemeinsames Mindestschutzniveau sichern und ermöglichen den Mitgliedstaaten weitergehende Verbesserungen der Arbeitsbedingungen. (S. 4–6)"},

{wb:"1.03",frage:"Welche Aussage zur europäischen Arbeitsschutzrahmenrichtlinie 89/391/EWG ist zutreffend?",antworten:["Sie regelt grundlegende Arbeitgeberpflichten, die Beurteilung von Arbeitsbedingungen und die Organisation des Arbeitsschutzes und bildet die Grundlage zahlreicher Einzelrichtlinien","Sie enthält ausschließlich technische Produktanforderungen, die Hersteller vor dem Inverkehrbringen erfüllen müssen","Sie beschränkt sich auf die Festlegung europäischer Mindesturlaubs- und Ruhezeiten"],richtig:0,erklaerung:"Die Arbeitsschutzrahmenrichtlinie enthält grundlegende Anforderungen an die betriebliche Gefahrenverhütung, die Beurteilung der Arbeitsbedingungen, Erste Hilfe, Unterweisung und Beteiligung der Beschäftigten. Sie bildet außerdem die Grundlage zahlreicher Einzelrichtlinien für besondere Gefährdungen und Arbeitsbedingungen. (S. 9)"},

{wb:"1.03",frage:"Warum reicht die Einhaltung der europäischen Maschinen-Richtlinie nicht allein durch eine nachträgliche Betriebsanleitung aus?",antworten:["Weil die Richtlinie ausschließlich die Marktüberwachung nach dem Verkauf betrifft","Weil sie bereits im Produktentstehungsprozess Maßnahmen wie Risikobeurteilung und Sicherheitskonzept sowie grundlegende Konstruktions- und Dokumentationsanforderungen vorsieht","Weil die Richtlinie keine Anforderungen an Hersteller, sondern ausschließlich an die späteren Betreiber stellt"],richtig:1,erklaerung:"Die im Wissensbaustein behandelte Maschinen-Richtlinie 2006/42/EG umfasst Herstellerpflichten während der Produktentwicklung, grundlegende Sicherheits- und Gesundheitsschutzanforderungen sowie Dokumentations- und Konformitätsanforderungen. Eine Betriebsanleitung ersetzt diese Pflichten nicht. Das Dokument nennt außerdem die Ablösung durch die Maschinenverordnung (EU) 2023/1230 ab dem 20.01.2027. (S. 7–8)"},

{wb:"1.03",frage:"Wie unterscheiden sich allgemein anerkannte Regeln der Technik und der Stand der Technik?",antworten:["Allgemein anerkannte Regeln der Technik beschreiben grundsätzlich den fortschrittlichsten Forschungsstand, während der Stand der Technik nur ältere Verfahren umfasst","Beide Begriffe sind vollständig gleichbedeutend und unterscheiden sich ausschließlich durch die herausgebende Institution","Allgemein anerkannte Regeln der Technik sind fachlich anerkannt und praktisch bewährt; der Stand der Technik kann fortschrittlicher sein, wenn seine praktische Eignung gesichert erscheint"],richtig:2,erklaerung:"Allgemein anerkannte Regeln der Technik beruhen auf fachlicher Anerkennung und praktischer Bewährung. Der Stand der Technik beschreibt einen fortschrittlichen aktuellen Entwicklungsstand, dessen praktische Eignung gesichert erscheint. Dafür ist kein Konsens aller Fachleute erforderlich. (S. 12–13, 28)"},

{wb:"1.03",frage:"Welche Bedeutung hat die Vermutungswirkung staatlicher Technischer Regeln?",antworten:["Bei Anwendung der entsprechenden staatlichen Regeln kann grundsätzlich davon ausgegangen werden, dass die Anforderungen der zugehörigen Verordnung rechtskonform erfüllt sind","Staatliche Technische Regeln ersetzen die zugehörigen Rechtsverordnungen und dürfen unabhängig von deren Schutzzielen angewendet werden","Die Vermutungswirkung bedeutet, dass ausschließlich die in einer Technischen Regel beschriebene Lösung rechtlich zulässig ist"],richtig:0,erklaerung:"Staatliche Regeln konkretisieren die Anforderungen von Verordnungen und entfalten Vermutungswirkung. Bei ihrer Anwendung kann grundsätzlich von einer rechtskonformen Erfüllung der entsprechenden Anforderungen ausgegangen werden. Andere Wege bleiben möglich, wenn das vorgeschriebene Schutzniveau erreicht wird. (S. 12)"},

{wb:"1.03",frage:"Welche Entwicklung beschreibt die Rechtspyramide des deutschen Arbeitsschutzrechts von oben nach unten?",antworten:["Die Rechtsverbindlichkeit und der allgemeine Geltungsanspruch nehmen zu, während die Zahl der Regelungen abnimmt","Der Konkretisierungsgrad und die Anzahl der Regelungen nehmen zu, während die Rechtsverbindlichkeit beziehungsweise der rechtliche Rang abnimmt","Alle Ebenen besitzen denselben rechtlichen Rang; lediglich die herausgebenden Institutionen unterscheiden sich"],richtig:1,erklaerung:"Die Rechtspyramide veranschaulicht die hierarchische Struktur des deutschen Rechtssystems. An der Spitze stehen Gesetze mit hoher Rechtsverbindlichkeit. Darunter folgen zunehmend konkretisierende Verordnungen, Vorschriften, Regeln und weitere Standards. Dabei steigen Anzahl und Konkretisierungsgrad nach unten. (S. 11–12)"},

{wb:"1.03",frage:"Warum werden in Arbeitsschutzvorschriften Begriffe wie Stand der Technik oder gesicherte Erkenntnisse verwendet?",antworten:["Damit die rechtliche Verantwortung vollständig auf technische Normungsgremien übertragen wird","Damit jede technische Weiterentwicklung erst nach einer Änderung des Grundgesetzes berücksichtigt werden kann","Damit rechtliche Anforderungen mit technischem und organisatorischem Fortschritt verbunden bleiben, ohne sämtliche Einzelheiten ständig gesetzlich neu festlegen zu müssen"],richtig:2,erklaerung:"Verweise auf technische Entwicklungsstände und gesicherte Erkenntnisse dynamisieren das Arbeitsschutzrecht. Dadurch können rechtliche Anforderungen auf fortschreitende technische und wissenschaftliche Entwicklungen Bezug nehmen. Das verbindet ein vergleichsweise beständiges Vorschriftenwerk mit Veränderungen der Arbeitswelt. (S. 14, 27)"},

{wb:"1.03",frage:"Worin besteht der grundlegende Unterschied zwischen dem Produktsicherheitsgesetz und dem Arbeitsschutzgesetz?",antworten:["Das Produktsicherheitsgesetz richtet sich insbesondere an Wirtschaftsakteure beim Inverkehrbringen von Produkten; das Arbeitsschutzgesetz regelt vor allem Pflichten und Rechte im betrieblichen Arbeitsschutz","Das Produktsicherheitsgesetz regelt ausschließlich den Gesundheitsschutz der Beschäftigten, während das Arbeitsschutzgesetz die Konstruktion von Maschinen vorschreibt","Beide Gesetze regeln ausschließlich die Herstellung von Produkten, unterscheiden sich aber hinsichtlich der zuständigen Aufsichtsbehörden"],richtig:0,erklaerung:"Das ProdSG enthält Anforderungen an Produkte und richtet sich insbesondere an Hersteller, Importeure und Händler. Das ArbSchG betrifft dagegen die Sicherheit und den Gesundheitsschutz der Beschäftigten bei der Arbeit und regelt unter anderem Arbeitgeberpflichten sowie Rechte und Pflichten der Beschäftigten. (S. 14, 16, 19)"},

{wb:"1.03",frage:"Welche Aussage zum Verhältnis von Arbeitsschutzgesetz, Rechtsverordnungen und Technischen Regeln trifft zu?",antworten:["Technische Regeln legen eigenständig gesetzliche Grundpflichten fest, während das ArbSchG lediglich unverbindliche Hinweise enthält","Das ArbSchG formuliert allgemeine Schutzziele, Verordnungen konkretisieren diese und Technische Regeln beschreiben mögliche Wege zur Erfüllung","Rechtsverordnungen sind grundsätzlich unverbindlich, solange keine zugehörige Technische Regel veröffentlicht wurde"],richtig:1,erklaerung:"Das ArbSchG enthält allgemein formulierte Schutzziele und grundlegende Pflichten. Verordnungen konkretisieren die Anforderungen für bestimmte Bereiche. Technische Regeln erläutern, wie die Anforderungen der Verordnungen erfüllt werden können, und können dabei Vermutungswirkung entfalten. (S. 19, 12)"},

{wb:"1.03",frage:"Welche Aussage beschreibt das duale Arbeitsschutzsystem in Deutschland korrekt?",antworten:["Staatliche Arbeitsschutzbehörden überwachen ausschließlich Produkte, Unfallversicherungsträger ausschließlich Arbeitsverträge","Die gesetzliche Unfallversicherung übernimmt sämtliche staatlichen Aufsichtsaufgaben, sobald ein Betrieb Mitglied eines Unfallversicherungsträgers ist","Staatliche Arbeitsschutzverwaltung und gesetzliche Unfallversicherung gestalten und überwachen den Arbeitsschutz nebeneinander und sollen dabei zusammenwirken"],richtig:2,erklaerung:"Das duale Arbeitsschutzsystem beruht auf dem Nebeneinander staatlicher Arbeitsschutzverwaltung und gesetzlicher Unfallversicherung. Beide Seiten wirken durch Vorschriften, Beratung und Überwachung auf die betriebliche Sicherheit und Gesundheit hin und sollen zusammenarbeiten. (S. 15, 28)"},

{wb:"1.03",frage:"Warum enthält das ASiG selbst keine abschließenden Vorgaben zur Zahl und zu den Einsatzzeiten von Betriebsärzten und Fachkräften für Arbeitssicherheit?",antworten:["Weil die nähere Regelung der betriebsärztlichen und sicherheitstechnischen Betreuung durch die Unfallversicherungsträger in der DGUV Vorschrift 2 erfolgt","Weil Unternehmen diese Fragen unabhängig von jeder weiteren Vorschrift ausschließlich freiwillig entscheiden dürfen","Weil die Arbeitsstättenverordnung sämtliche Einsatzzeiten von Betriebsärzten und Fachkräften für Arbeitssicherheit unmittelbar festlegt"],richtig:0,erklaerung:"Das ASiG legt die grundsätzlichen Anforderungen an Bestellung, Aufgaben und Zusammenarbeit der betrieblichen Arbeitsschutzfachleute fest. Die konkrete betriebsärztliche und sicherheitstechnische Betreuung wird in der DGUV Vorschrift 2 geregelt. (S. 20–21)"},

{wb:"1.03",frage:"Welche Zuordnung der Regelwerke zur betrieblichen Anwendung ist korrekt?",antworten:["Gefahrstoffverordnung – ASR; Arbeitsstättenverordnung – TRGS; Betriebssicherheitsverordnung – AMR","Gefahrstoffverordnung – TRGS; Arbeitsstättenverordnung – ASR; Betriebssicherheitsverordnung – TRBS","Gefahrstoffverordnung – TRBS; Arbeitsstättenverordnung – TRBA; Betriebssicherheitsverordnung – ASR"],richtig:1,erklaerung:"Die Tabelle des Wissensbausteins ordnet der Gefahrstoffverordnung die Technischen Regeln für Gefahrstoffe (TRGS), der Arbeitsstättenverordnung die Technischen Regeln für Arbeitsstätten (ASR) und der Betriebssicherheitsverordnung die Technischen Regeln für Betriebssicherheit (TRBS) zu. (S. 20)"},

{wb:"1.03",frage:"Welche Aussage unterscheidet DGUV Vorschriften von DGUV Regeln zutreffend?",antworten:["DGUV Regeln sind für Mitgliedsbetriebe verbindlicher als DGUV Vorschriften, weil sie detailliertere Anforderungen enthalten","DGUV Vorschriften und DGUV Regeln besitzen unabhängig von ihrer Bezeichnung stets dieselbe Rechtsverbindlichkeit","DGUV Vorschriften enthalten verbindliche Pflichten für die jeweiligen Mitgliedsbetriebe; DGUV Regeln konkretisieren Anforderungen und haben empfehlenden Charakter"],richtig:2,erklaerung:"DGUV Vorschriften sind rechtsverbindliche Unfallverhütungsvorschriften der zuständigen Unfallversicherungsträger. DGUV Regeln erläutern und konkretisieren Anforderungen oder stellen branchenspezifische Empfehlungen zusammen. Ihre größere fachliche Detailtiefe bedeutet nicht dieselbe Rechtsverbindlichkeit. (S. 24)"},

{wb:"1.03",frage:"Welche Funktion erfüllt das Grundgesetz als Grundlage des deutschen Arbeitsschutzrechts?",antworten:["Es verankert unter anderem das Recht auf körperliche Unversehrtheit, das Sozialstaatsprinzip und den staatlichen Auftrag zum Schutz von Sicherheit und Gesundheit","Es enthält sämtliche konkreten technischen Anforderungen an Arbeitsstätten, Maschinen und persönliche Schutzausrüstungen","Es überträgt die gesamte Rechtsetzung im Arbeitsschutz ausschließlich auf die gesetzlichen Unfallversicherungsträger"],richtig:0,erklaerung:"Das Grundgesetz bildet als höchste Rechtsnorm eine grundlegende rechtliche Basis des Arbeitsschutzes. Das Recht auf körperliche Unversehrtheit, das Sozialstaatsprinzip und die staatliche Zuständigkeit für die Rechtsetzung begründen den staatlichen Schutzauftrag. Konkrete Anforderungen werden durch nachgeordnete Rechtsvorschriften geregelt. (S. 11)"},

{wb:"1.03",frage:"Welche Aussage beschreibt den Unterschied zwischen staatlicher Arbeitsschutzaufsicht und Marktüberwachung?",antworten:["Die staatliche Arbeitsschutzaufsicht kontrolliert ausschließlich Hersteller, während die Marktüberwachung nur Arbeitszeiten prüft","Die staatliche Arbeitsschutzaufsicht überwacht die Umsetzung des Arbeitsschutzrechts in Betrieben; die Marktüberwachung richtet sich auf die Einhaltung von Produktanforderungen am Markt","Beide Aufsichtsformen sind ausschließlich für die Genehmigung von Unfallverhütungsvorschriften zuständig"],richtig:1,erklaerung:"Die staatlichen Arbeitsschutzbehörden überwachen die Umsetzung des staatlichen Arbeitsschutzrechts in Betrieben. Die Marktüberwachung betrifft dagegen die Sicherheit und Rechtskonformität bereitgestellter Produkte und richtet sich insbesondere an Wirtschaftsakteure und Marktüberwachungsbehörden. (S. 7, 15, 18)"},

{wb:"1.03",frage:"Warum umfasst der soziale Arbeitsschutz neben Arbeitszeitregelungen auch besondere Vorschriften für bestimmte Personengruppen?",antworten:["Weil die allgemeinen betrieblichen Arbeitsschutzvorschriften für diese Personengruppen grundsätzlich keine Anwendung finden","Weil sozialer Arbeitsschutz ausschließlich die finanziellen Leistungen der Sozialversicherung behandelt","Weil neben allgemeinen Arbeitsbedingungen besondere Schutzbedürfnisse beispielsweise von Jugendlichen, Schwangeren und Menschen mit Behinderungen berücksichtigt werden sollen"],richtig:2,erklaerung:"Der soziale Arbeitsschutz umfasst Regelungen zur Arbeitszeit, Arbeitnehmerüberlassung und zum Schutz besonders schutzbedürftiger Personengruppen. Hierzu behandelt der Wissensbaustein insbesondere das JArbSchG, MuSchG und SGB IX. Diese Regelungen ergänzen die allgemeinen Anforderungen des Arbeitsschutzes. (S. 22–23)"},

{wb:"1.03",frage:"Ein Hersteller möchte eine neue Maschine in mehreren EU-Mitgliedstaaten anbieten. Ein Mitgliedstaat verlangt zusätzliche nationale Konstruktionsanforderungen über die harmonisierten EU-Produktvorschriften hinaus. Wie ist dies nach dem Wissensbaustein einzuordnen?",antworten:["Solche zusätzlichen Anforderungen widersprechen dem Grundsatz, dass harmonisierte EU-Produktvorschriften national weder unter- noch überschritten werden dürfen","Zusätzliche nationale Anforderungen sind stets zulässig, weil sämtliche EU-Vorschriften lediglich Mindeststandards darstellen","Die zusätzlichen Anforderungen sind automatisch verbindlich, sobald sie von einem nationalen Unfallversicherungsträger empfohlen werden"],richtig:0,erklaerung:"Harmonisierte Produktvorschriften sollen gleiche Wettbewerbsbedingungen und einen Binnenmarkt ohne Handelshemmnisse ermöglichen. Deshalb dürfen Mitgliedstaaten die harmonisierten Anforderungen nach der Darstellung des Wissensbausteins national weder unter- noch überschreiten. (S. 5)"},

{wb:"1.03",frage:"Ein Unternehmen stellt fest, dass ein von ihm angebotenes Verbraucherprodukt gefährlich sein könnte. Welche Reaktion entspricht der im Wissensbaustein beschriebenen europäischen Produktsicherheitssystematik?",antworten:["Die Angelegenheit betrifft ausschließlich den späteren Betreiber, weil Produktsicherheit erst mit der betrieblichen Nutzung beginnt","Die Produktsicherheit muss gewährleistet werden; zuständige Marktüberwachungsbehörden können gegen unsichere Produkte vorgehen und Informationen über Safety Gate austauschen","Eine behördliche Reaktion ist ausgeschlossen, solange das Produkt nicht ausdrücklich unter die Maschinen-Richtlinie fällt"],richtig:1,erklaerung:"Die europäischen Anforderungen an die allgemeine Produktsicherheit verpflichten Wirtschaftsakteure, sichere Produkte bereitzustellen. Nationale Marktüberwachungsbehörden überwachen die Produktsicherheit und können Maßnahmen gegen unsichere Produkte ergreifen. Der Informationsaustausch erfolgt unter anderem über Safety Gate. (S. 7)"},

{wb:"1.03",frage:"Ein Maschinenhersteller hat eine Risikobeurteilung durchgeführt, jedoch weder die erforderlichen technischen Unterlagen noch eine Betriebsanleitung vorbereitet. Welche Bewertung ergibt sich aus den beschriebenen Anforderungen der Maschinen-Richtlinie?",antworten:["Die Risikobeurteilung ersetzt die Dokumentationspflichten vollständig, sofern das Sicherheitskonzept nachvollziehbar ist","Dokumentationsanforderungen gelten ausschließlich für die späteren Betreiber und nicht für den Hersteller","Neben der Risikobeurteilung müssen auch die vorgesehenen Dokumentations- und Konformitätsanforderungen vor dem Bereitstellen beziehungsweise der Inbetriebnahme erfüllt werden"],richtig:2,erklaerung:"Die Maschinen-Richtlinie umfasst neben der Risikobeurteilung und grundlegenden Sicherheitsanforderungen auch Dokumentationspflichten. Dazu zählen technische Unterlagen, Betriebsanleitungen und die vorgesehenen Konformitätsverfahren und -erklärungen. Die Erfüllung nur einer dieser Anforderungsgruppen reicht nicht aus. (S. 7–8)"},

{wb:"1.03",frage:"Ein Unternehmen möchte einen chemischen Stoff in der EU bereitstellen. Welche Fragestellung ist nach dem Wissensbaustein vorrangig dem europäischen REACH-System zuzuordnen?",antworten:["Ob ausreichende Informationen über die Stoffeigenschaften vorliegen und die erforderlichen Registrierungs- und Bewertungsverfahren eingehalten werden","Ob der Betrieb einen Arbeitsschutzausschuss mit der vorgeschriebenen Mitgliederzahl eingerichtet hat","Ob die tägliche Arbeitszeit der Beschäftigten den Vorgaben der Arbeitszeitrichtlinie entspricht"],richtig:0,erklaerung:"REACH regelt die Registrierung, Bewertung, Zulassung und Beschränkung chemischer Stoffe. Ziel ist unter anderem, ausreichende Erkenntnisse über die Wirkungen von Stoffen auf Mensch und Umwelt sicherzustellen. Die Registrierung erfolgt bei der ECHA. (S. 8)"},

{wb:"1.03",frage:"Ein Betrieb hält eine staatliche Technische Regel nicht wortgleich ein, kann aber nachweisen, dass er das in der Verordnung geforderte Schutzniveau auf andere Weise erreicht. Welche Aussage entspricht dem Wissensbaustein?",antworten:["Jede Abweichung von einer staatlichen Technischen Regel ist unabhängig vom erreichten Schutzniveau unzulässig","Andere Lösungswege sind grundsätzlich möglich, sofern das verbindliche Schutzniveau der zugrunde liegenden Vorschrift erreicht wird","Eine alternative Lösung ist nur zulässig, wenn die betreffende Rechtsverordnung zuvor vollständig aufgehoben wurde"],richtig:1,erklaerung:"Regeln beschreiben Wege zur Erfüllung verbindlicher Anforderungen. Nicht jede einzelne beschriebene Vorgehensweise ist selbst zwingend. Entscheidend ist die Einhaltung des geforderten Mindestschutzniveaus. Bei Anwendung staatlicher Regeln besteht zusätzlich eine Vermutungswirkung hinsichtlich der Erfüllung der Verordnung. (S. 12)"},

{wb:"1.03",frage:"In einem Betrieb wird ein neu entwickeltes Schutzverfahren diskutiert. Seine praktische Eignung erscheint gesichert, ein vollständiger Konsens aller Fachleute besteht jedoch noch nicht. Welchem Begriff entspricht dies am ehesten?",antworten:["Allgemein anerkannte Regel der Technik, weil ein Fachkonsens dafür nicht erforderlich ist","Stand von Wissenschaft und Technik, weil praktische Eignung grundsätzlich noch nicht beurteilt werden darf","Stand der Technik, weil ein fortschrittlicher Entwicklungsstand mit gesichert erscheinender praktischer Eignung vorliegt"],richtig:2,erklaerung:"Der Stand der Technik setzt einen fortschrittlichen aktuellen Entwicklungsstand voraus, dessen praktische Eignung gesichert erscheint. Ein Konsens aller Fachleute ist nicht erforderlich. Allgemein anerkannte Regeln der Technik setzen dagegen eine breite fachliche Anerkennung und praktische Bewährung voraus. (S. 13)"},

{wb:"1.03",frage:"Ein Forschungsinstitut entwickelt ein Schutzverfahren für eine Tätigkeit mit sehr hohem Gefährdungspotenzial. Die Wirksamkeit wurde durch Forschung und Experimente erprobt, praktische Anwendungen liegen aber noch nicht vor. Welcher technische Maßstab passt am besten?",antworten:["Stand von Wissenschaft und Technik","Allgemein anerkannte Regel der Technik","Gesicherte Erkenntnis mit bereits nachgewiesener praktischer Bewährung"],richtig:0,erklaerung:"Der Stand von Wissenschaft und Technik beschreibt das höchste Anforderungsniveau. Erkenntnisse müssen durch Forschung und Experimente erprobt sein, brauchen aber noch nicht praktisch umgesetzt worden zu sein. Dieser Maßstab wird insbesondere bei sehr hohem Gefährdungspotenzial verwendet. (S. 13)"},

{wb:"1.03",frage:"Ein Betrieb plant die Bereitstellung und regelmäßige Prüfung von Arbeitsmitteln. Welche Kombination aus Rechtsverordnung und Technischen Regeln ist dafür nach der Tabelle des Wissensbausteins einschlägig?",antworten:["Arbeitsstättenverordnung und Technische Regeln für Arbeitsstätten (ASR)","Betriebssicherheitsverordnung und Technische Regeln für Betriebssicherheit (TRBS)","Produktsicherheitsgesetz und Technische Regeln für Gefahrstoffe (TRGS)"],richtig:1,erklaerung:"Die Betriebssicherheitsverordnung enthält Bestimmungen zur Bereitstellung, Benutzung und Prüfung von Arbeitsmitteln sowie zu überwachungsbedürftigen Anlagen. Die zugehörigen Technischen Regeln für Betriebssicherheit (TRBS) konkretisieren diese Anforderungen. (S. 20)"},

{wb:"1.03",frage:"Ein Unternehmen möchte die Arbeitsplatzgestaltung in Büroräumen einschließlich Bildschirmarbeitsplätzen überprüfen. Welches Regelwerk ist nach dem Wissensbaustein hierfür besonders einschlägig?",antworten:["Die 9. Produktsicherheitsverordnung mit den Technischen Regeln für Betriebssicherheit","Die Gefahrstoffverordnung mit den Technischen Regeln für Gefahrstoffe","Die Arbeitsstättenverordnung mit den Technischen Regeln für Arbeitsstätten"],richtig:2,erklaerung:"Die Arbeitsstättenverordnung regelt Anforderungen an Arbeitsstätten einschließlich Bildschirmarbeit. Ihre Anforderungen werden durch die Technischen Regeln für Arbeitsstätten (ASR) konkretisiert. Produktvorschriften und Gefahrstoffregelungen betreffen andere Regelungsbereiche. (S. 20)"},

{wb:"1.03",frage:"Ein Unternehmen beschäftigt 24 Personen. Die Geschäftsleitung meint, ein Arbeitsschutzausschuss sei freiwillig, weil bereits eine Fachkraft für Arbeitssicherheit bestellt wurde. Welche Aussage trifft zu?",antworten:["Nach dem ASiG ist in Unternehmen mit mehr als 20 Beschäftigten ein Arbeitsschutzausschuss vorgeschrieben; die Bestellung einer Sifa ersetzt ihn nicht","Ein Arbeitsschutzausschuss ist nur erforderlich, wenn keine Fachkraft für Arbeitssicherheit bestellt wurde","Die Einrichtung eines Arbeitsschutzausschusses wird ausschließlich durch die Produktsicherheitsverordnungen geregelt"],richtig:0,erklaerung:"Das ASiG schreibt für Unternehmen mit mehr als 20 Beschäftigten einen Arbeitsschutzausschuss vor. Er dient der Beratung von Arbeitsschutzanliegen und umfasst verschiedene betriebliche Akteure. Laut Glossar muss der ASA mindestens einmal vierteljährlich zusammentreten. (S. 21, 28)"},
